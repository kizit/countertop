<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>Dashboard settings</title>
<style>
<!--#include control/style.css-->
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="bar">
      <button class="link l" id="back" hidden>‹ <span id="backlbl">Settings</span></button>
      <h1 id="title"></h1>
      <a class="link r" id="done" href="/dash" target="_blank">Open dashboard</a>
    </div>
    <div id="screen"></div>
  </div>
  <div class="pv" id="pv" hidden>
    <div id="starterpv"></div>
    <div class="pvbar">
      <span class="seg" id="pvpage"></span>
      <button id="pvedit">Edit on screen</button>
      <span class="seg" id="pvsize" role="group" aria-label="Preview size"><button data-w="1920" data-h="1080" class="on" aria-pressed="true">Full screen</button><button data-w="1920" data-h="980" aria-pressed="false">With browser bar</button><button data-w="1080" data-h="1920" aria-pressed="false">Portrait</button></span>
      <span class="note"><span id="pvres">1920×1080</span> preview. Click a tile to change it.</span>
    </div>
    <div class="pvbox" id="pvbox"><iframe id="pvf" title="Dashboard preview" width="1920" height="1080"></iframe></div>
  </div>
</div>
<div id="lib" hidden></div>
<div id="toast" style="opacity:0"></div>
