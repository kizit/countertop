<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen</title>
<!-- Home dashboard. Pages, tiles and settings come from GET /config; tile types from /tiles.js. Edit on screen (hold a tile) or at /control. -->
<style>
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  :root{--fg:#e9ecf1;--dim:#a9b1bb;--faint:#6b737e;--bg:#0a0c0f;--card:rgba(18,22,28,.84);--line:rgba(255,255,255,.08);
    --accent:#7cb7ff;--team:#e8344e;--teamb:#0b1f3f;--teamy:#f6c443;--page-w:100vw;--page-h:100vh}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;cursor:none;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #sky{position:fixed;inset:0;z-index:0;background:var(--bg)}
  #sky div{position:absolute;inset:0;transition:opacity 60s}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #fun2{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
  #pages{position:relative;z-index:1;display:flex;width:var(--page-w);height:var(--page-h);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .page[hidden]{display:none}
  .page{position:relative;width:var(--page-w);height:var(--page-h);padding:22px 36px 26px;display:grid;gap:16px;min-height:0}
  header{display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;min-height:0;overflow:hidden;position:relative}
  .card[hidden]{display:none}
  .card h3{margin:0 0 10px;font-size:16px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase;font-weight:600;
    display:flex;justify-content:space-between;gap:12px}
  .card h3 small{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400;font-size:15px}
  .empty{color:var(--faint);font-size:22px}
  .err{color:#e8a08a}
  /* fonts for the clock and weather styles (SIL OFL, served from tools/fonts) */
  @font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/BebasNeue-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/DMSerifDisplay-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/Fraunces-300.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:300 600;font-display:swap;src:url(/fonts/JetBrainsMono-300.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/Nunito-300.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Outfit';font-style:normal;font-weight:200 600;font-display:swap;src:url(/fonts/Outfit-200.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 600;font-display:swap;src:url(/fonts/SpaceGrotesk-300.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  /* your own tiles */
  .m-mine{display:flex;flex-direction:column;min-height:0}
  .m-mine iframe.mine{flex:1 1 auto;width:100%;min-height:0;border:0;background:transparent;display:block}
  /* clock */
  .m-clock{zoom:var(--cz,1)}
  .m-clock .t{font-size:136px;font-weight:200;letter-spacing:-4px;line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
  .m-clock .t .ap{margin-left:.25em}
  .m-clock .t .ss{font-size:.45em;letter-spacing:0;opacity:.75}
  .m-clock .d{font-size:30px;color:#d5dbe3;margin-top:6px}
  .m-clock .d:empty{display:none}
  .m-clock .d b{color:var(--accent);font-weight:400}
  .m-clock .c{font-size:21px;color:#c3cad3;margin-top:8px}
  .m-clock .c:empty{display:none}
  .cs-bold .t{font-size:210px;font-weight:400;letter-spacing:2px;line-height:.82}
  .cs-bold .t .ap{font-size:.38em;letter-spacing:3px;margin-left:.12em;opacity:.8}
  .cs-bold .d,.cs-bold .c{text-transform:uppercase;letter-spacing:.07em}
  .cs-serif .t{font-size:156px;font-weight:400;letter-spacing:-2px;line-height:.92}
  .cs-serif .t .ap{font-size:.34em;font-style:italic;margin-left:.15em}
  .cs-serif .d{font-style:italic}
  .cs-digital .t{font-size:120px;font-weight:300;letter-spacing:-4px;text-shadow:0 0 30px color-mix(in srgb,var(--accent) 55%,transparent)}
  .cs-digital .t .sep{animation:blink 2s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .cs-digital .t .ap{font-size:.3em;letter-spacing:0;margin-left:.35em}
  .cs-digital .d,.cs-digital .c{font-size:22px;letter-spacing:.02em}
  .cs-rounded .t{font-size:136px;font-weight:800;letter-spacing:-3px}
  .cs-rounded .t .ap{font-size:.32em;font-weight:300;margin-left:.15em}
  .cs-stacked .t{display:inline-grid;grid-template-columns:auto auto;font-size:132px;font-weight:200;line-height:.8;letter-spacing:-5px}
  .cs-stacked .t .hh{grid-column:1;grid-row:1}
  .cs-stacked .t .mm{grid-column:1;grid-row:2;opacity:.62}
  .cs-stacked .t .sep{display:none}
  .cs-stacked .t .ap{grid-column:2;grid-row:2;align-self:end;font-size:.28em;letter-spacing:0;margin:0 0 .35em .3em}
  .cs-stacked .t .ss{grid-column:2;grid-row:1;align-self:end;margin:0 0 .3em .3em;font-size:.28em}
  .cs-stacked .d{margin-top:14px}
  .cs-minimal .t{font-size:100px;font-weight:200;letter-spacing:-2px}
  .cs-minimal .t .ap{font-size:.38em;margin-left:.2em;opacity:.7}
  .cs-minimal .d{font-size:22px;color:var(--dim)}
  .cs-minimal .c{display:none}
  /* weather */
  .m-weather{text-align:right;zoom:var(--cz,1)}
  .m-weather .row{display:flex;align-items:center;gap:20px;justify-content:var(--jc,flex-end)}
  .m-weather .g{font-size:86px;line-height:1;animation:bob 6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-4deg)}}
  .m-weather .tt{font-size:100px;font-weight:200;line-height:1}
  .m-weather .m{font-size:23px;color:#d5dbe3;text-align:left;line-height:1.4}
  .m-weather .s{font-size:20px;color:#d5dbe3;margin-top:6px}
  .ws-big-temperature .row{display:grid;grid-template-columns:auto auto;grid-template-areas:"tt g" "tt m";column-gap:22px;row-gap:4px;align-items:center}
  .ws-big-temperature .tt{grid-area:tt;font-size:196px;letter-spacing:-8px;line-height:.82}
  .ws-big-temperature .g{grid-area:g;font-size:66px;align-self:end}
  .ws-big-temperature .m{grid-area:m;align-self:start;font-size:21px}
  .ws-compact .row{gap:14px}
  .ws-compact .g{font-size:54px}
  .ws-compact .tt{font-size:66px;font-weight:300}
  .ws-compact .m{font-size:22px;white-space:nowrap}
  .ws-compact .s{font-size:18px}
  .ws-big-icon .row{flex-direction:column;align-items:var(--jc,flex-end);gap:2px}
  .ws-big-icon .g{font-size:150px}
  .ws-big-icon .tt{font-size:80px;font-weight:300}
  .ws-big-icon .m{text-align:inherit;font-size:21px}
  .ws-minimal .row{flex-wrap:wrap;gap:0 18px}
  .ws-minimal .g{font-size:60px}
  .ws-minimal .tt{font-size:116px;letter-spacing:-4px}
  .ws-minimal .m{flex-basis:100%;text-align:inherit;font-size:21px;color:var(--dim)}
  .pill{display:inline-block;margin-top:8px;font-size:22px;background:#16273a;border:1px solid #24496e;color:#cfe3ff;border-radius:22px;padding:5px 15px}
  .pill.snow{background:#1d2633;border-color:#4b5d75;color:#eef4ff}
  .pill.dry{background:transparent;border-color:transparent;color:#c3cad3;padding:5px 0}
  /* week strip */
  .m-week{display:grid;gap:12px;background:none;border:0;padding:0;overflow:visible}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-height:150px}
  .day .dn{font-size:19px;color:var(--dim);display:flex;justify-content:space-between}
  .day .dn b{color:var(--fg);font-weight:500}
  .day .w{display:flex;align-items:center;gap:8px;font-size:26px}
  .day .w span{font-size:30px}
  .day .w small{font-size:18px;color:var(--faint)}
  .day .pp{font-size:16px;color:#8fc3ff;min-height:18px}
  .day .ev{font-size:18px;background:rgba(255,255,255,.06);border-left:3px solid var(--accent);border-radius:6px;padding:4px 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .ev.team{border-left-color:var(--team)}
  .day .ev.hol{border-left-color:#7fd1a0}
  .col .day .w small{display:none}
  .col .day{padding:9px 10px;min-height:130px}
  .col .day .ev{font-size:16px}
  .day .more{font-size:15px;color:var(--faint)}
  .day.today{border-color:color-mix(in srgb, var(--accent) 55%, transparent);background:rgba(28,24,22,.88)}
  .day.today .ev{font-size:21px;padding:6px 10px}
  .day.today .ev em{font-style:normal;color:var(--accent);margin-right:8px}
  /* hourly */
  .m-hourly{display:flex;gap:10px;background:none;border:0;padding:0}
  .hour{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .hour .h{font-size:18px;color:var(--dim)} .hour .t{font-size:32px;font-weight:300} .hour .p{font-size:16px;color:#8fc3ff}
  /* photos */
  /* big tile */
  .m-stage{padding:0;background:#0b0f16}
  .m-stage .view{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
  .m-stage .view.on{opacity:1}
  .m-stage canvas{position:absolute;inset:0}
  .m-stage .map{position:absolute;inset:0;overflow:hidden;background:#11151c}
  .m-stage .lyr{position:absolute;inset:0}
  .m-stage .lyr img{position:absolute;max-width:none;user-select:none}
  .m-stage .fr{transition:opacity .25s;opacity:0;mix-blend-mode:screen}
  .m-stage .home{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#ffbe6b;box-shadow:0 0 0 5px rgba(255,190,107,.35),0 0 18px #ffbe6b}
  .m-stage .ovl{position:absolute;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .m-stage img.dkmap{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.35)}
  .m-stage .osmc{left:10px;bottom:6px;font-size:11px;opacity:.55}
  .m-stage .tl{left:22px;top:18px;display:flex;flex-direction:column;gap:2px}
  .m-stage .tl b{font-size:30px;font-weight:600}
  .m-stage .tl span{font-size:20px;color:#cdd3db}
  .m-stage .br{right:22px;bottom:24px;font-size:20px;color:#cdd3db;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px}
  .m-stage .bl{left:0;right:0;bottom:0;padding:60px 26px 22px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;flex-direction:column;gap:6px}
  .m-stage .bl b{font-size:28px;font-weight:600}
  .m-stage .bl span{font-size:19px;color:#d6dbe2;line-height:1.35;max-width:1000px}
  .m-stage .bl small{font-size:15px;color:#aab2bc;letter-spacing:.4px}
  .m-stage .sc{flex-direction:row;align-items:baseline;gap:10px;font-size:22px;color:#eef1f5;background:linear-gradient(transparent,rgba(0,0,0,.45))}
  .m-stage .sc b{font-size:30px}
  .m-stage .rbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08);z-index:3}
  .m-stage .rbar i{display:block;height:100%;background:#7cb7ff;transition:width .3s}
  .m-stage .v-space .img{position:absolute;inset:0;background-size:cover;background-position:center}
  .m-stage .trk{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .m-stage .trk path{fill:none;stroke-width:3;stroke-linecap:round}
  .m-stage .trk .p{stroke:rgba(255,190,107,.45);stroke-dasharray:2 8}
  .m-stage .trk .f{stroke:rgba(124,183,255,.85)}
  .m-stage .iss{position:absolute;font-size:44px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 12px rgba(124,183,255,.9));transition:left 4.8s linear,top 4.8s linear}
  .m-stage .cam,.m-stage .cam iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .m-stage .cm{transition:opacity 1.5s;background:rgba(0,0,0,.35);padding:10px 14px;border-radius:12px}
  .m-stage .cm.dim{opacity:.0}
  .m-stage .cm span{color:#ff8a80;font-size:16px;font-weight:600;letter-spacing:.5px}
  .m-stage .v-cams{pointer-events:none}
  .m-stage .sdots{position:absolute;right:20px;top:22px;z-index:4;display:flex;gap:7px}
  .m-stage .sdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
  .m-stage .sdots i.on{background:#fff}
  .m-photos{padding:0;background:#000}
  .m-photos .img{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.6s}
  .m-photos .img.fit{background-size:contain;background-repeat:no-repeat}
  .m-photos .blur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55);transition:opacity 1.6s}
  .m-photos .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 22px 16px;background:linear-gradient(transparent,rgba(0,0,0,.6));
    font-size:22px;color:#f1f3f6;display:flex;justify-content:space-between;gap:20px}
  .m-photos .cap:empty{display:none}
  .m-photos .cap span{color:#cfd6de;font-size:18px;white-space:nowrap}
  .m-photos .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:linear-gradient(160deg,#1d2a44,#3a2a4a);text-align:center;padding:30px}
  .m-photos .ph b{font-size:64px} .m-photos .ph div{font-size:26px} .m-photos .ph small{font-size:19px;color:var(--dim)}
  /* team */
  .col > .pair{flex:0 0 auto;display:flex;gap:var(--gap,18px);min-height:0}
  .col > .pair.grow{flex:1 1 0}
  .pair > .card{flex:1 1 0;min-width:0}
  .pair .m-team{padding:14px 18px}
  .slot.narrow > .m-team{padding:14px 18px}
  .pair .m-team h3{font-size:13px;margin-bottom:8px}
  .slot.narrow > .m-team h3{font-size:13px;margin-bottom:8px}
  .pair .m-team .row{flex-direction:column;align-items:flex-start;gap:8px}
  .slot.narrow > .m-team .row{flex-direction:column;align-items:flex-start;gap:8px}
  .pair .m-team .crest{display:none}
  .slot.narrow > .m-team .crest{display:none}
  .pair .m-team .vs{font-size:24px;font-weight:600}
  .slot.narrow > .m-team .vs{font-size:24px;font-weight:600}
  .pair .m-team .when{font-size:17px}
  .slot.narrow > .m-team .when{font-size:17px}
  .pair .m-team .last{font-size:16px;margin-top:8px}
  .slot.narrow > .m-team .last{font-size:16px;margin-top:8px}
  .pair .m-fun h3{font-size:13px;margin-bottom:8px}
  .slot.narrow > .m-fun h3{font-size:13px;margin-bottom:8px}
  .pair .m-fun .tx{font-size:20px;-webkit-line-clamp:6}
  .slot.narrow > .m-fun .tx{font-size:20px;-webkit-line-clamp:6}
  .pair .m-fun .a{font-size:18px}
  .slot.narrow > .m-fun .a{font-size:18px}
  .m-team{background:linear-gradient(120deg,var(--teamb) 0%,#13305e 55%,#3b1530 100%);border-color:rgba(232,52,78,.5)}
  .m-team h3{color:#ffd6dc}
  .m-team .row{display:flex;align-items:center;gap:18px}
  .crest{flex:none;width:64px;height:64px;border-radius:14px;background:var(--team);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;letter-spacing:.5px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  .m-team .vs{font-size:30px}
  .m-team .when{font-size:22px;color:#d9e2f0;margin-top:2px}
  .m-team .badge{font-size:14px;background:var(--teamy);color:#2a1d00;border-radius:10px;padding:3px 10px;font-weight:700;letter-spacing:.4px}
  .m-team .badge.live{background:#ff4d4d;color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .m-team .last{margin-top:10px;font-size:20px;color:#c9d3e3}
  .m-team .last b.w{color:#7ff0a0} .m-team .last b.l{color:#ff9a9a} .m-team .last b.d{color:#ffe08a}
  /* grocery */
  .m-groc{display:flex;flex-direction:column}
  .m-groc.narrow .gl{grid-template-columns:1fr}
  .m-groc.narrow.two .gl{grid-template-columns:1fr 1fr;column-gap:14px}
  .m-groc.narrow.two .gi{font-size:20px}
  .m-groc.narrow.small .gi{font-size:17px;padding:2px 0}
  .m-dinner{display:flex;flex-direction:column;gap:12px}
  .m-dinner h3{margin-bottom:0}
  .m-dinner .ph{flex:1 1 auto;min-height:110px;border-radius:14px;background:#2a2f38 center/cover;position:relative;overflow:hidden}
  .m-dinner .ph div{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
  .m-dinner .ph b{display:block;font-size:24px;font-weight:600;line-height:1.2;color:#fff}
  .m-dinner .ph span{color:#d6dbe2;font-size:16px}
  .m-dinner small{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
  .m-dinner .chips{display:flex;flex-wrap:wrap;gap:7px}
  .m-dinner .chips i{font-style:normal;font-size:16px;background:rgba(255,255,255,.06);border-radius:20px;padding:4px 11px;color:#d6dbe2}
  .m-dinner .chips.big i{font-size:21px;padding:7px 14px}
  .pair .m-team.up{padding:14px 18px}
  .slot.narrow > .m-team.up{padding:14px 18px}
  .m-team.up h3{font-size:13px;margin-bottom:6px}
  .m-team.up .g{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1)}
  .m-team.up .g:first-of-type{border-top:0}
  .m-team.up .g .d{flex:none;width:92px;color:#ffd6dc;font-size:16px}
  .m-team.up .g .o{flex:1;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- weather codes ---------- */
function wx(code, night){
  if (code === 0) return {g: night ? "🌙" : "☀️", t:"Clear"};
  if (code === 1) return {g: night ? "🌙" : "🌤️", t:"Mostly clear"};
  if (code === 2) return {g: night ? "☁️" : "⛅", t:"Partly cloudy"};
  if (code === 3) return {g:"☁️", t:"Overcast"};
  if (code === 45 || code === 48) return {g:"🌫️", t:"Fog"};
  if (code >= 51 && code <= 57) return {g:"🌦️", t:"Drizzle"};
  if (code >= 61 && code <= 67) return {g:"🌧️", t:"Rain"};
  if (code >= 71 && code <= 77) return {g:"🌨️", t:"Snow"};
  if (code >= 80 && code <= 82) return {g:"🌧️", t:"Showers"};
  if (code >= 85 && code <= 86) return {g:"🌨️", t:"Snow showers"};
  if (code >= 95) return {g:"⛈️", t:"Storms"};
  return {g:"·", t:"—"};
}

/* ---------- "rain coming" note from the next 12 hourly slots ---------- */
function isWet(code){ return code != null && ((code >= 51 && code <= 67) || (code >= 71 && code <= 86) || code >= 95); }
function isSnow(code){ return code != null && ((code >= 71 && code <= 77) || code === 85 || code === 86); }
function rainNote(j, curCode){
  const H = j.hourly, now = new Date();
  const i0 = H.time.findIndex(t => new Date(t) > now); if (i0 < 0) return "";
  const pp = H.precipitation_probability || [], wc = H.weather_code || [];
  const hr = i => new Date(H.time[i]).toLocaleTimeString([], {hour:"numeric"});
  const end = Math.min(i0 + 12, H.time.length);
  const wetAt = i => (pp[i] != null && pp[i] >= 50) || isWet(wc[i]);
  const pill = (snow, txt) => '<span class="pill' + (snow ? " snow" : "") + '">' + txt + '</span>';
  if (isWet(curCode)){
    const kind = isSnow(curCode) ? "Snow" : "Rain";
    for (let i = i0; i < end; i++) if (!wetAt(i)) return pill(kind === "Snow", kind + " now · easing by " + hr(i));
    return pill(kind === "Snow", kind + " for the next several hours");
  }
  for (let i = i0; i < end; i++){
    if (wetAt(i)){
      const kind = isSnow(wc[i]) ? "Snow" : "Rain";
      const pct = pp[i] != null ? " (" + pp[i] + "%)" : "";
      return pill(kind === "Snow", kind + " likely around " + hr(i) + pct);
    }
  }
  let mx = 0; for (let i = i0; i < end; i++) mx = Math.max(mx, pp[i] || 0);
  return mx < 20 ? '<span class="pill dry">Dry for the next 12 hours</span>' : "";
}

/* ---------- seasons & holidays ---------- */
function nthWeekday(y, m, wd, n){ const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + 7*(n-1)); return d; }

  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  const t0 = new Date(y, m, day).getTime();
  const tg = nthWeekday(y, 10, 4, 4).getTime();          // 4th Thursday of November
  const daysTo = Math.round((tg - t0) / 86400e3);
  const xmas = Math.round((new Date(y, 11, 25).getTime() - t0) / 86400e3);
  if (m === 0 && day === 1) return {accent:"#ffd36e", greet:"🎉 Happy New Year", fun:"newyear"};

  if (m === 9 && day >= 20) return {accent:"#ff9a3c", greet: day === 31 ? "🎃 Happy Halloween" : "🎃", fun:"halloween"};
  if (daysTo === 0) return {accent:"#f0a050", greet:"🦃 Happy Thanksgiving", fun:"thanks"};
  if (daysTo > 0 && daysTo <= 7) return {accent:"#f0a050", greet:"🦃", fun:"thanks"};

  if (m === 11 && day === 31) return {accent:"#ffd36e", greet:"🥂 New Year's Eve", fun:"newyear"};

/* ---------- sky colors follow the real sunrise/sunset ---------- */

  dawn:   "linear-gradient(180deg, #3a2a52 0%, #8a4a5a 38%, #c9774f 62%, #1a1420 100%)",
  morning:"linear-gradient(180deg, #2a5a8c 0%, #1d3a5c 45%, #0d1726 100%)",

let sunT = null, skyNow = "", skyFlip = false, skyNowSet = false;
function skyPhase(){
  if (!sunT) return "day";

  if (n < r + 150*m) return "morning";

  if (!sunT) return;                       // wait for real sunrise/sunset before painting a sky
  const ph = skyPhase();

/* ---------- moon phase (for the night clock and the sunrise line) ---------- */
function moon(d){
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const age = (((d.getTime() - ref) / 86400e3) % syn + syn) % syn;

  if (h < 9) return wd === 0 || wd === 6 ? "Slow morning ☕" : "Good morning ☕";
  if (h < 12) return "Good morning";
  if (h < 14) return "Lunch time? 🥪";
  if (h < 17) return wd === 5 ? "Almost the weekend 🎉" : "Good afternoon";
  if (h < 20) return "What's for dinner? 🍝";
  return "Good evening 🌙";
}
/* ---------- effects library: every effect is one small animation that can be turned on, sized and timed on its own ----------
   Shared by the dashboard (full-screen canvases) and Controls (little live previews on each card). */
const FXLIB = (function(){
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const weighted = list => { const tot = list.reduce((a, x) => a + x[1], 0); let r = Math.random() * tot; for (const x of list){ r -= x[1]; if (r <= 0) return x; } return list[0]; };
  const COLORS = ["#ff6b6b","#ffd36e","#6bd3ff","#8fffa0","#c58bff","#ff9ad5","#ffffff"];
  const AMT = {Few:.5, Some:1, Lots:1.8};
  // emoji are drawn once into small canvases and reused (much cheaper than fillText every frame)
  const sprites = {};
  function sprite(g, s){
    s = Math.max(12, Math.round(s / 4) * 4);
    const k = g + s;
    if (!sprites[k]){
      const c = document.createElement("canvas"); c.width = c.height = Math.ceil(s * 1.3);
      const x = c.getContext("2d"); x.font = s + "px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(g, c.width / 2, c.height / 2 + s * .06);
      sprites[k] = c;
    }
    return sprites[k];
  }
  function drawSprite(cx, g, s, x, y, rot, a, sy){
    const sp = sprite(g, s);
    cx.save(); cx.globalAlpha = a; cx.translate(x, y); if (rot) cx.rotate(rot); if (sy) cx.scale(1, sy);
    cx.drawImage(sp, -sp.width / 2, -sp.height / 2); cx.restore();
  }

  /* ----- weather ----- */
  function rain(o){
    const n = Math.round((o.kind === "drizzle" ? 70 : 140) * o.amt), P = [];
    const drop = init => ({x:R(0, o.W * 1.1), y:init ? R(-o.H, o.H) : R(-80, -10), v:R(16, 26), l:R(14, 26)});
    for (let i = 0; i < n; i++) P.push(drop(true));

      cx.strokeStyle = o.front ? "rgba(185,210,255,.34)" : "rgba(160,195,255,.3)"; cx.lineWidth = 1.5;
      cx.beginPath();
      for (const p of P){ cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.l * .25, p.y + p.l); p.y += p.v; p.x -= p.v * .25; if (p.y > o.H) Object.assign(p, drop(false)); }

        if (Date.now() > next){ flash = .16; next = Date.now() + (o.preview ? R(4e3, 7e3) : R(9e3, 25e3)); }
        if (flash > 0){ cx.fillStyle = "rgba(220,230,255," + flash.toFixed(3) + ")"; cx.fillRect(0, 0, o.W, o.H); flash -= .012; }
      }

  }
  function snow(o){

      cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath();
      for (const p of P){ p.ph += .02; p.y += p.v; p.x += Math.sin(p.ph) * .6; cx.moveTo(p.x + p.r, p.y); cx.arc(p.x, p.y, p.r, 0, 6.29); if (p.y > o.H + 5) Object.assign(p, f(false)); }

  }
  function clouds(o){
    const P = [], c = () => ({x:R(-300, o.W), y:R(-60, o.H * .6), v:R(.1, .3), r:R(240, 460)});
    for (let i = 0; i < Math.max(2, Math.round(6 * o.amt)); i++) P.push(c());
    return cx => {
      for (const p of P){
        p.x += p.v; if (p.x - p.r > o.W){ p.x = -p.r; p.y = R(-60, o.H * .6); }

  function fog(o){

        g.addColorStop(0, "rgba(190,198,208,0)"); g.addColorStop(.5, "rgba(190,198,208,.12)"); g.addColorStop(1, "rgba(190,198,208,0)");

  function sun(o){
    const P = [];
    for (let i = 0; i < Math.round(26 * o.amt); i++) P.push({x:R(0, o.W), y:R(0, o.H), vx:R(-.15, .15), vy:R(-.25, -.05), r:R(1.5, 3.5), ph:R(0, 6.3)});
    let a = 0;

      const sx = o.W * .8, sy = -60, H = o.H;

      cx.fillStyle = g; cx.fillRect(0, 0, o.W, H);

      }

      for (const p of P){
        p.ph += .02; p.x += p.vx; p.y += p.vy; if (p.y < -10){ p.y = H + 10; p.x = R(0, o.W); }
        cx.fillStyle = "rgba(255,236,190," + (.25 + .2 * Math.sin(p.ph)).toFixed(3) + ")";
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill();

  function stars(o){

    for (let i = 0; i < Math.round(70 * o.amt); i++) P.push({x:R(0, o.W), y:R(0, o.H * .7), r:R(.7, 1.9), ph:R(0, 6.3), sp:R(.01, .03)});
    return cx => {
      for (const p of P){ p.ph += p.sp; cx.fillStyle = "rgba(225,232,255," + (.3 + .3 * Math.sin(p.ph)).toFixed(3) + ")"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill(); }
      return true;

  /* ----- seasonal: emoji drifting across the screen. [glyph, weight, motion]: fall | rise | fly | flutter ----- */
  const SETS = {
    leaves:    {n:16, dots:0,  g:[["🍂",5,"fall"],["🍁",5,"fall"],["🌰",1,"fall"],["🍎",1,"fall"]]},
    halloween: {n:16, dots:0,  g:[["🍂",3,"fall"],["🍁",3,"fall"],["🎃",3,"fall"],["🦇",2,"fly"],["👻",1,"rise"],["🍬",1,"fall"]]},
    thanks:    {n:18, dots:0,  g:[["🍂",5,"fall"],["🍁",5,"fall"],["🦃",1,"fall"],["🥧",1,"fall"],["🌽",1,"fall"],["🎃",1,"fall"]]},
    xmas:      {n:12, dots:45, g:[["❄️",4,"fall"],["⭐",1,"fall"],["🎁",1,"fall"],["🔔",1,"fall"],["🍬",1,"fall"],["🎄",1,"fall"]]},
    winter:    {n:8,  dots:55, g:[["❄️",1,"fall"]]},
    newyear:   {n:10, dots:0,  g:[["🎉",1,"fall"],["✨",2,"fall"],["🥳",1,"fall"]]},
    valentine: {n:14, dots:0,  g:[["💕",2,"rise"],["💗",2,"rise"],["❤️",1,"rise"]]},
    spring:    {n:12, dots:0,  g:[["🌸",4,"fall"],["🌼",2,"fall"],["🦋",1,"flutter"]]},
    july4:     {n:10, dots:0,  g:[["⭐",2,"fall"],["🇺🇸",1,"fall"]]},
    summer:    {n:5,  dots:0,  g:[["🦋",2,"flutter"],["🐝",1,"flutter"]]}
  };
  function falling(set){
    return o => {
      const S = SETS[set], W = o.W, H = o.H, P = [], D = [];
      const part = init => {
        const [g, , mo] = weighted(S.g), s = R(24, 58), depth = (s - 24) / 34;
        const p = {g, mo, s, a:.55 + depth * .4, ph:R(0, 6.3), rot:R(-.6, .6), vr:R(-.02, .02)};
        if (mo === "fall"){ p.x = R(0, W); p.y = init ? R(-H, H) : R(-80, -30); p.vy = R(.7, 1.3) + depth * 1.3; }
        if (mo === "rise"){ p.x = R(0, W); p.y = init ? R(0, H * 2) : H + 50; p.vy = -(R(.6, 1.1) + depth); }
        if (mo === "fly"){ p.x = init ? R(-W, W) : -80; p.y = R(H * .05, H * .6); p.vx = R(1.6, 3) + depth; p.rot = 0; p.vr = 0; }
        if (mo === "flutter"){ p.x = R(0, W); p.y = R(H * .1, H * .9); p.vx = R(-1, 1); p.vy = R(-.6, .6); p.rot = 0; p.vr = 0; }
        return p;
      };
      for (let i = 0; i < Math.max(1, Math.round(S.n * o.amt)); i++) P.push(part(true));
      for (let i = 0; i < Math.round(S.dots * o.amt); i++) D.push({x:R(0, W), y:R(-H, H), r:R(1.2, 3.6), v:R(.5, 1.6), ph:R(0, 6.3)});
      return cx => {
        if (D.length){
          cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath();
          for (const d of D){ d.ph += .02; d.y += d.v; d.x += Math.sin(d.ph) * .5; if (d.y > H + 5){ d.y = -5; d.x = R(0, W); } cx.moveTo(d.x + d.r, d.y); cx.arc(d.x, d.y, d.r, 0, 6.29); }
          cx.fill();
        }
        for (const p of P){
          p.ph += .02;
          if (p.mo === "fall"){ p.y += p.vy; p.x += Math.sin(p.ph) * (1 + p.s / 40); p.rot += p.vr + Math.sin(p.ph) * .01; }
          if (p.mo === "rise"){ p.y += p.vy; p.x += Math.sin(p.ph) * .8; }
          if (p.mo === "fly"){ p.x += p.vx; p.y += Math.sin(p.ph * 2) * 1.2; }
          if (p.mo === "flutter"){
            p.vx = Math.max(-1.6, Math.min(1.6, p.vx + R(-.15, .15))); p.vy = Math.max(-1, Math.min(1, p.vy + R(-.12, .12)));
            p.x += p.vx; p.y += p.vy; if (p.x < -40) p.x = W + 30; if (p.x > W + 40) p.x = -30; if (p.y < 0 || p.y > H) p.vy = -p.vy;
          }
          const flap = (p.mo === "fly" || p.mo === "flutter") ? .65 + .35 * Math.abs(Math.sin(p.ph * 5)) : 0;
          drawSprite(cx, p.g, p.s, p.x, p.y, p.rot, p.a, flap);
          if (p.y > H + 70 || p.y < -90 || p.x > W + 90) Object.assign(p, part(false));
        }
        return true;
      };
    };
  }

  /* ----- shows: a short scene that plays once, then ends ----- */
  function show(kind){
    return o => {
      const W = o.W, H = o.H, a = o.amt; let fx = [];
      const N = n => Math.max(1, Math.round(n * a));
      const gust = glyphs => { for (let i = 0; i < N(40); i++) fx.push({k:"spr", g:pick(glyphs), s:R(26, 60), x:R(-600, -40), y:R(H * .1, H * .9), vx:R(9, 16), vy:0, ph:R(0, 6.3), amp:R(1.5, 4), rot:R(0, 6.3), vr:R(.05, .15), a:.9}); };
      if (kind === "gust") gust(["🍂","🍁","🍂","🍁","🌰"]);
      if (kind === "flurry") for (let i = 0; i < N(90); i++) fx.push({k:"dot", x:R(-700, -10), y:R(0, H), vx:R(8, 15), vy:R(.5, 2), r:R(1.5, 4.5), ph:R(0, 6.3)});
      if (kind === "turkey") fx.push({k:"walker", g:"🦃", s:110, x:W + 80, y:H - 70, vx:-2.6, ph:0, trail:"🍂"});
      if (kind === "santa") fx.push({k:"sleigh", x:W + 150, t:0});
      if (kind === "bats") for (let i = 0; i < N(14); i++) fx.push({k:"spr", g:"🦇", s:R(30, 64), x:R(-500, -40), y:R(H * .05, H * .55), vx:R(5, 9), vy:0, ph:R(0, 6.3), amp:R(2, 5), rot:0, vr:0, a:.95, flap:true});
      if (kind === "heartburst") for (let i = 0; i < N(30); i++) fx.push({k:"spr", g:pick(["💕","💗","❤️","💖"]), s:R(26, 56), x:R(0, W), y:H + R(20, 400), vx:0, vy:-R(3, 6), ph:R(0, 6.3), amp:R(1, 3), rot:0, vr:0, a:.9});
      if (kind === "butterflies") for (let i = 0; i < N(6); i++) fx.push({k:"spr", g:pick(["🦋","🦋","🐝"]), s:R(34, 56), x:R(-400, -40), y:R(H * .2, H * .8), vx:R(2.5, 4.5), vy:0, ph:R(0, 6.3), amp:R(2, 4), rot:0, vr:0, a:.95, flap:true});
      if (kind === "fireworks") for (let i = 0; i < N(7); i++) fx.push({k:"rocket", x:R(W * .1, W * .9), y:H + 10, vy:-R(19, 25) * Math.sqrt(H / 1080), fuse:R(.3, .6) * H, delay:i * R(500, 1100), born:Date.now(), c:pick(COLORS)});
      if (kind === "confetti") fx.push({k:"confgen", until:Date.now() + (o.ms || 4500)});
      function step(cx, f, now){
        if (f.k === "spr"){
          f.ph += .06; f.x += f.vx; f.y += f.vy + Math.sin(f.ph) * f.amp; f.rot += f.vr;
          if (f.fade) f.a = Math.max(0, f.a - .01);
          drawSprite(cx, f.g, f.s, f.x, f.y, f.rot, f.a, f.flap ? .6 + .4 * Math.abs(Math.sin(f.ph * 3)) : 0);
          return f.x < W + 120 && f.y > -120 && f.a > 0;
        }
        if (f.k === "dot"){
          f.ph += .05; f.x += f.vx; f.y += f.vy + Math.sin(f.ph) * 2;
          cx.fillStyle = "rgba(255,255,255,.8)"; cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.29); cx.fill();
          return f.x < W + 20;
        }
        if (f.k === "walker"){
          f.ph += .25; f.x += f.vx;
          drawSprite(cx, f.g, f.s, f.x, f.y - Math.abs(Math.sin(f.ph)) * 10, Math.sin(f.ph) * .08, 1, 0);

          return f.x > -150;

        if (f.k === "sleigh"){
          f.t += 1; f.x -= 5.2;
          const y = H * .2 + Math.sin(f.x / W * Math.PI) * -H * .08 + Math.sin(f.t * .08) * 6;
          for (let i = 0; i < 3; i++) drawSprite(cx, "🦌", 58, f.x + i * 66, y + Math.sin(f.t * .25 + i) * 5, 0, 1, 0);
          drawSprite(cx, "🛷", 74, f.x + 230, y + 12, 0, 1, 0);
          drawSprite(cx, "🎅", 56, f.x + 226, y - 18, 0, 1, 0);
          if (f.t % 2 === 0) fx.push({k:"spark", x:f.x + 270 + R(-10, 10), y:y + R(-20, 25), life:1, c:pick(["#fff6c2","#ffe27a","#ffffff","#bfe3ff"])});
          return f.x > -420;
        }
        if (f.k === "spark"){
          f.life -= .025; f.y += .4;
          cx.fillStyle = f.c; cx.globalAlpha = Math.max(0, f.life); cx.beginPath(); cx.arc(f.x, f.y, 2.6 * f.life + .5, 0, 6.29); cx.fill(); cx.globalAlpha = 1;
          return f.life > 0;
        }
        if (f.k === "rocket"){
          if (now - f.born < f.delay) return true;
          f.y += f.vy; f.vy *= .975;
          cx.strokeStyle = "rgba(255,240,190,.8)"; cx.lineWidth = 3;
          cx.beginPath(); cx.moveTo(f.x, f.y); cx.lineTo(f.x, f.y - f.vy * 3); cx.stroke();
          if (H - f.y > f.fuse + H * .25 || f.vy > -3){
            for (let i = 0; i < 80; i++){ const an = R(0, 6.29), sp = R(2, 8); fx.push({k:"spk", x:f.x, y:f.y, vx:Math.cos(an) * sp, vy:Math.sin(an) * sp, life:1, c:f.c}); }
            return false;
          }
          return true;
        }
        if (f.k === "spk"){
          f.x += f.vx; f.y += f.vy; f.vy += .07; f.vx *= .985; f.life -= .016;
          cx.globalAlpha = Math.max(0, f.life); cx.fillStyle = f.c; cx.beginPath(); cx.arc(f.x, f.y, 2.8, 0, 6.29); cx.fill(); cx.globalAlpha = 1;
          return f.life > 0;
        }
        if (f.k === "confgen"){
          for (let i = 0; i < Math.max(1, Math.round(3 * a)); i++) fx.push({k:"conf", x:R(0, W), y:-10, vx:R(-2, 2), vy:R(2, 6), r:R(0, 6.3), vr:R(-.2, .2), c:pick(COLORS), w:R(8, 14)});
          return now < f.until;
        }
        if (f.k === "conf"){
          f.x += f.vx; f.y += f.vy; f.vy += .05; f.r += f.vr;

          return f.y < H + 20;
        }
        return false;
      }
      return cx => {
        const now = Date.now(), cur = fx; fx = [];          // a step may add sparks, trails or confetti
        const kept = cur.filter(f => step(cx, f, now));
        fx = kept.concat(fx);
        return fx.length > 0;
      };
    };
  }

  /* ----- when does an effect play ----- */
  function nthWeekday(y, m, wd, n){ const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + 7 * (n - 1)); return d; }
  const mdNum = s => { const [m, d] = String(s).split("-").map(Number); return m * 100 + d; };
  const inMd = (d, a, b) => { const k = (d.getMonth() + 1) * 100 + d.getDate(), x = mdNum(a), y = mdNum(b); return x <= y ? k >= x && k <= y : k >= x || k <= y; };
  function seasonRanges(def, y){
    if (def.season === "thanks"){ const t = nthWeekday(y, 10, 4, 4), s = new Date(t); s.setDate(t.getDate() - 7);

  }

  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mdTxt = s => { const [m, d] = String(s).split("-").map(Number); return MON[m - 1] + " " + d; };
  function seasonText(def){

  /* ----- a canvas that runs effects. Drawing is in 1920-wide units (opt.base) and scaled to the canvas ----- */
  function Runner(cv, opt){
    opt = opt || {};
    const cx = cv.getContext("2d");
    let W = 1920, H = 1080, k = 1, list = [], running = false, last = 0, paused = false;
    function size(){
      const w = opt.full ? innerWidth : cv.clientWidth || 320, h = opt.full ? innerHeight : cv.clientHeight || 180;
      const dpr = opt.full ? 1 : Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      W = opt.base || 1920; k = cv.width / W; H = cv.height / k;
      list.forEach(e => { if (e.keep) e.draw = e.make(); });
    }
    size(); if (opt.full) addEventListener("resize", size);
    function frame(ts){
      if (!running) return;
      requestAnimationFrame(frame);
      if (ts - last < 1000 / (opt.fps || 25)) return;
      last = ts;
      cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
      cx.setTransform(k, 0, 0, k, 0, 0);
      if (opt.under) opt.under(cx, W, H);
      const beh = opt.over ? list.filter(e => e.behind) : [], top = opt.over ? list.filter(e => !e.behind) : list;
      const run = e => { let alive = true; try{ alive = e.draw(cx); }catch(err){ alive = false; } if (!alive && !e.keep){ e.dead = true; if (e.done) e.done(); } };
      beh.forEach(run);
      if (opt.over) opt.over(cx, W, H);
      top.forEach(run);
      list = list.filter(e => !e.dead);
      if (!list.length && !opt.always){ running = false; cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); }
    }
    function start(){ if (!running && !paused && (list.length || opt.always)){ running = true; requestAnimationFrame(frame); } }
    function inst(id, p, keep){
      const def = BY[id]; if (!def) return null;
      const e = {id, key:id + "|" + p.amount + "|" + (p.kind || "") + "|" + !!p.front, keep, behind:!!p.behind,
        make:() => def.make({amt:AMT[p.amount] || 1, kind:p.kind, front:p.front, preview:opt.preview, ms:p.ms, W, H})};
      e.draw = e.make(); return e;
    }
    return {
      // the continuous effects that should be running now: [{id, amount, kind, front, behind}]
      set(want){
        const keys = want.map(p => p.id + "|" + p.amount + "|" + (p.kind || "") + "|" + !!p.front);
        list = list.filter(e => !e.keep || keys.includes(e.key));
        want.forEach((p, i) => { if (!list.some(e => e.keep && e.key === keys[i])){ const e = inst(p.id, p, true); if (e) list.push(e); } });
        start();
      },
      play(id, p, done){ const e = inst(id, p || {}, false); if (!e) return; e.done = done; list.push(e); start(); },
      busy(){ return list.some(e => !e.keep); },
      pause(p){ paused = p; if (p){ running = false; list = list.filter(e => e.keep); cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); } else start(); },
      clear(){ list = []; },
      size, start
    };
  }
  return {L, BY, GROUPS, AMT, conf, whenText, timeOk, inSeason, seasonText, wxMode, Runner, mdTxt};
})();

function evDate(e){ return /^\d{4}-\d{2}-\d{2}$/.test(e.start || "") ? new Date(e.start + "T00:00:00") : new Date(e.start); }

// collapse repeats (weekly shows) into their next showing, tagged
function collapseRepeats(list){
  const groups = new Map();
  for (const e of list){ const k = (e.summary || "").toLowerCase(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  return [...groups.values()].map(g => {
    const e = Object.assign({}, g[0]);
    if (g.length > 1){
      const gaps = g.slice(1).map((x, i) => Math.round((evDate(x) - evDate(g[i])) / 86400e3));
      if (gaps.every(x => x === 7)) e.rep = "every " + evDate(g[0]).toLocaleDateString([], {weekday:"short"});
      else if (gaps.every(x => x === 1)) e.rep = "daily";

}

  const k = dayKey(day), out = [];

// has(): something to show (a stack skips it otherwise); urgent(): wants the box now (if its takeover is on)
function tileHas(id){ const m = MODULES[id]; try{ return !m.has || !!m.has(); }catch(e){ return true; } }

/* ---------- shared by the weather and map tiles ---------- */
const WET = c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const SNOWY = c => (c >= 71 && c <= 77) || c === 85 || c === 86;
function hourlyFrom(j, hours){
  // the forecast's hourly rows from this hour on
  if (!j || !j.hourly || !j.hourly.time) return [];
  const H = j.hourly, now = Date.now() - 3600e3, out = [];
  for (let i = 0; i < H.time.length && out.length < hours; i++){
    const t = new Date(H.time[i]).getTime();
    if (t < now) continue;
    out.push({t, temp:H.temperature_2m[i], pp:H.precipitation_probability ? H.precipitation_probability[i] : 0,
      code:H.weather_code ? H.weather_code[i] : 0, day:H.is_day ? H.is_day[i] !== 0 : true});
  }
  return out;
}
// when rain (or snow) is near: {inMin, kind, pp} or null
function rainSoon(s){
  s = s || {}; const j = STATE.wx;
  if (!j || !j.current) return null;
  const c = j.current.weather_code;
  if (WET(c) || SNOWY(c)) return {inMin:0, kind: SNOWY(c) ? "Snow" : c >= 95 ? "Storms" : "Rain", pp:100};
  const rows = hourlyFrom(j, (s.hours || 2) + 1), lim = s.chance || 40;
  for (const r of rows){
    if (r.t > Date.now() + (s.hours || 2) * 3600e3) break;
    if (r.pp >= lim || WET(r.code) || SNOWY(r.code))
      return {inMin: Math.max(0, Math.round((r.t - Date.now()) / 60e3)), kind: SNOWY(r.code) ? "Snow" : r.code >= 95 ? "Storms" : "Rain", pp:r.pp};
  }
  return null;
}

/* web-mercator tiles placed as <img>s (no canvas, so cross-origin tiles are fine) */
const TILE = {
  x(lon, z){ return (lon + 180) / 360 * 256 * Math.pow(2, z); },
  y(lat, z){ const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * Math.pow(2, z); },
  // fill `layer` with tiles of zoom zt drawn in zoom-z pixel space, centered at (cx, cy)
  fill(layer, urlFn, zt, z, cx, cy, W, H, cls){
    const P = 256 * Math.pow(2, z - zt), n = Math.pow(2, zt), x0 = cx - W / 2, y0 = cy - H / 2;
    let h = "";
    for (let ty = Math.floor(y0 / P); ty <= Math.floor((y0 + H) / P); ty++){
      if (ty < 0 || ty >= n) continue;
      for (let tx = Math.floor(x0 / P); tx <= Math.floor((x0 + W) / P); tx++){
        const wx = ((tx % n) + n) % n;
        h += '<img class="' + (cls || "") + '" alt="" src="' + urlFn(zt, wx, ty) + '" style="left:' + Math.round(tx * P - x0) + 'px;top:' +
          Math.round(ty * P - y0) + 'px;width:' + Math.ceil(P) + 'px;height:' + Math.ceil(P) + 'px">';
      }
    }
    layer.innerHTML = h;
  }
};
// base map: OpenStreetMap's own tiles (free, no key; CARTO's dark maps now need one), darkened with a CSS filter
const OSM = (z, x, y) => "https://tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png";
const OSM_CREDIT = '<div class="ovl osmc">© OpenStreetMap</div>';


// a tile drawn by a "view" object (maps, charts, video): built once, then shown, ticked and hidden as its box needs
function viewTile(type, meta, view){
  Tile(type, Object.assign({cls:"m-stage", every:1, noFit:true,
    render(el){
      let v = el._v;
      if (!v){ v = el._v = Object.create(view); v.s = this.s; v.tile = this; el.innerHTML = '<div class="view on v-' + type + '"></div>'; v.build(el.firstChild); }
      if (!v.active){ v.active = true; try{ v.show(); }catch(e){ reportErr("tile " + type, e.message || String(e)); } }
      else if (v.tick) v.tick();
    },
    hide(el){ const v = el._v; if (v && v.active){ v.active = false; v.hide && v.hide(); } }
  }, meta));
}

const dayCount = () => pageList().filter(n => n !== "night").length;

// Silk hands touch drags to its own scrolling and cancels pointer events, so listen to
// touch events too (and the page sets touch-action:none). Whichever ends first wins.
let swipe = null, lastSwipe = 0;
function swStart(x, y){ swipe = {x, y, lx:x, ly:y}; }
function swMove(x, y){ if (swipe){ swipe.lx = x; swipe.ly = y; } }
function swEnd(x, y){
  if (!swipe) return;
  if (x == null){ x = swipe.lx; y = swipe.ly; }
  const dx = x - swipe.x, dy = y - swipe.y; swipe = null;
  if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - lastSwipe > 400){
    if (EDIT.on || NIGHT.mode === "night") return;
    lastSwipe = Date.now(); showPage(Math.max(0, Math.min(dayCount() - 1, PAGE + (dx < 0 ? 1 : -1))));
  }
}

document.addEventListener("touchmove", e => {
  const t = e.touches[0]; if (!t || !swipe) return;
  swMove(t.clientX, t.clientY);
  if (Math.abs(t.clientX - swipe.x) > 10 && e.cancelable) e.preventDefault();
}, {passive:false});
document.addEventListener("touchend", e => { const t = e.changedTouches[0]; swEnd(t ? t.clientX : null, t ? t.clientY : null); });

}

/* ---------- effects: the ones that are on and whose time it is (see FXLIB) ---------- */
const FXD = {back:null, front:null, wx:null, next:{}, paused:false};
const fxItems = () => S("effects").items || [];
const fxOn = () => FXCFG.any && !FXD.paused;
const fxEmojiOk = def => !def.emoji || !LOOK.plain;          // with emoji turned off, the emoji effects rest too
function fxInit(){ if (!FXD.back){ FXD.back = FXLIB.Runner($("fx"), {full:true, fps:22}); FXD.front = FXLIB.Runner($("fun2"), {full:true, fps:30}); } }
function fxUpdate(){
  fxInit();
  const B = [], F = [], d = new Date();
  if (fxOn()) for (const def of FXLIB.L){
    if (def.layer === "show" || !fxEmojiOk(def)) continue;
    const c = FXLIB.conf(fxItems(), def.id); if (!c.on) continue;
    const wxNow = !!FXD.wx && !!def.wx && def.wx.includes(FXD.wx);
    if (!(def.wx ? c.when === "always" || wxNow : FXLIB.timeOk(c, d))) continue;
    const p = {id:def.id, amount:c.amount, kind: def.id === "rain" ? (wxNow ? FXD.wx : "rain") : "", front: def.layer === "fall" && FXCFG.front};
    (p.front ? F : B).push(p);
  }
  const gone = [].concat(...B.concat(F).map(p => FXLIB.BY[p.id].replaces || []));     // e.g. Thanksgiving's leaves stand in for the plain ones
  FXD.back.set(B.filter(p => !gone.includes(p.id))); FXD.front.set(F.filter(p => !gone.includes(p.id)));
  window.FXINFO = Object.assign(window.FXINFO || {}, {wx:FXD.wx, running:B.concat(F).map(p => p.id)});
}
function fxShows(){          // a show whose turn has come plays; one at a time
  fxInit();
  if (!fxOn() || document.hidden || FXD.front.busy()) return;
  const now = Date.now(), d = new Date();
  for (const def of FXLIB.L){
    if (def.layer !== "show" || def.party || !fxEmojiOk(def)) continue;
    const c = FXLIB.conf(fxItems(), def.id);
    if (!c.on || !FXLIB.timeOk(c, d)){ delete FXD.next[def.id]; continue; }
    const ev = Math.max(2, +c.every || 15) * 60e3;
    if (!FXD.next[def.id]){ FXD.next[def.id] = now + ev * (.25 + Math.random() * .5); continue; }
    if (now >= FXD.next[def.id]){
      FXD.next[def.id] = now + ev * (.85 + Math.random() * .3);
      FXD.front.play(def.id, {amount:c.amount});
      window.FXINFO = Object.assign(window.FXINFO || {}, {lastShow:def.id});
      return;
    }
  }
}

    "What the tile should show:\n" + (desc && desc.trim() ? desc.trim() : "(describe it here)") + "\n\n" +
    "Rules for the code:\n" +
    "- Reply with ONE self-contained HTML snippet: HTML with inline <style> and <script>. No separate files, no build step, no libraries that need installing. It is placed inside <body> of a page that is already set up, so leave out <html>, <head> and <body>.\n" +
    "- It fills a box whose size can change (from about 400x300 up to 1200x800 pixels). Make the layout flexible (flexbox or grid, percentages) and keep everything inside the box with no scrolling.\n" +
    "- Keep the background transparent; the dashboard draws a card behind it. These CSS variables are available: var(--fg) for main text, var(--dim) for secondary text, var(--accent) for a highlight color.\n" +
    "- It must be readable from a distance: no text under 18px, and the main number or words 40px or bigger.\n" +
    "- For live data, use fetch() with a free public web API that works from a browser (allows CORS) and needs no API key. Never put passwords or private keys in the code. Refresh with setInterval, no more often than every 5 minutes.\n" +
    "- It can't use cookies, localStorage or pop-ups, and can't reach the page around it. Nobody uses a mouse or keyboard on it.\n" +
    "- If the data can't be loaded, show a short friendly message instead of an error.\n" +
    "- Plain JavaScript and modern CSS; make it clean and good-looking. Emoji are fine.\n" +
    "- Reply with just the code.";
}
function copyText(txt){
  const ta = $("edclip"); ta.value = txt; ta.focus(); ta.select();
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(txt).then(() => flash("Copied. Paste it into ChatGPT.", true), () => flash("Couldn't copy here: try from Controls on a computer"));
  else flash(ok ? "Copied. Paste it into ChatGPT." : "Couldn't copy here: try from Controls on a computer", ok);
}
function openSetup(kind){
  try{ if (inFrame()){ window.parent.dashSetup(kind); return; } }catch(e){}
  flash("Set these up in Controls → Setup → " + ((SRCK[kind] || [])[1] || kind) + " on your phone or computer");
}

/* ----- actions ----- */
function selSlot(){ const pg = curPg(); return pg && (pg.slots || []).find(s => s.id === EDIT.sel); }
function removeBox(s){
  const pg = curPg(); remember();
  smods(s).forEach(dropTileItem);
  pg.slots = pg.slots.filter(v => v !== s); if (EDIT.sel === s.id){ EDIT.sel = null; EDIT.tile = null; }
  relayout();
}
// the biggest rectangle (up to a tile's usual size) that fits in free space around a cell
function fitAt(pg, size, c, r, skip){
  const [dw, dh, mw, mh] = size;
  const sizes = [];
  for (let w = dw; w >= mw; w--) for (let h = dh; h >= mh; h--) sizes.push([w, h]);
  sizes.sort((a, b) => b[0] * b[1] - a[0] * a[1]);
  for (const [w, h] of sizes){
    const cx = c - Math.floor(w / 2), cy = r - Math.floor(h / 2), C = [];
    for (let y = r - h + 1; y <= r; y++) for (let x = c - w + 1; x <= c; x++) C.push({x, y, w, h, d:Math.abs(x - cx) + Math.abs(y - cy)});
    C.sort((a, b) => a.d - b.d);
    for (const R of C){ delete R.d; if (inGrid(R) && !blocked(pg, R, skip)) return R; }
  }
  return null;
}
// the first free place, top-left first, for a tile of this size (shrinking down to its smallest)
function freeSpot(pg, size){
  const [dw, dh, mw, mh] = size, sizes = [];
  for (let w = dw; w >= mw; w -= U) for (let h = dh; h >= mh; h -= U) sizes.push([w, h]);
  sizes.sort((a, b) => b[0] * b[1] - a[0] * a[1]);
  for (const [w, h] of sizes) for (let y = 0; y + h <= GR; y++) for (let x = 0; x + w <= GC; x++){ const R = {x, y, w, h}; if (!blocked(pg, R)) return R; }
  return null;
}
function growFree(s){         // stretch right, then down, then left and up, until something is in the way
  const pg = curPg(); remember();
  const tryStep = (k, d) => { const t = Object.assign({}, s); if (k === "x"){ t.x -= d; t.w += d; } else if (k === "y"){ t.y -= d; t.h += d; } else t[k] += d;
    if (inGrid(t) && !blocked(pg, t, s)){ Object.assign(s, t); return true; } return false; };
  let more = true;
  while (more){ more = false; for (const k of ["w", "h", "x", "y"]) if (tryStep(k, 1)) more = true; }
  relayout();
}
function addEmptyBox(){
  const pg = curPg(), R = freeSpot(pg, [12 * U, 8 * U, 1, 1]);
  if (!R){ flash("No room left: make a box smaller first"); return; }
  remember(); const s = Object.assign({id:"s" + Date.now().toString(36), mod:null}, R);
  pg.slots.push(s); EDIT.sel = s.id; EDIT.tile = null; relayout();
}
function flash(t, ok){ const h = $("edhint"); h.textContent = t; h.classList.toggle("warn", !ok); h.classList.toggle("ok", !!ok); setTimeout(() => { h.classList.remove("warn", "ok"); edPaint(); }, 3000); }
// make a new tile of this type and put it in box s (an existing box, or a new one given as a rectangle)
function addTile(type, s){
  const pg = curPg(); remember();
  const id = newTile(type);
  const L = live(s); L.push(id); setSmods(s, L);
  if (!pg.slots.includes(s)) pg.slots.push(s);
  EDIT.sel = s.id; EDIT.tile = id; EDIT.panel = null; EDIT.addTo = null;
  relayout(); refeed(id);
}
function addTileAnywhere(type){
  const tgt = EDIT.addTo && slotById(EDIT.addTo);
  if (tgt) return addTile(type, tgt);
  const R = freeSpot(curPg(), TYPES[type].size);
  if (!R){ flash("No free space: drag it onto a box to share that box, or make room first"); return; }
  addTile(type, Object.assign({id:"s" + Date.now().toString(36), mod:null}, R));
}
function stackAct(a, id){
  const s = selSlot(); if (!s) return;
  const L = smods(s), i = L.indexOf(id);
  remember();
  if (a === "up" && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
  else if (a === "dn" && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
  setSmods(s, L); relayout();
}
function removeTile(id){
  const s = selSlot(); if (!s) return;
  remember();
  setSmods(s, smods(s).filter(x => x !== id)); dropTileItem(id);
  EDIT.tile = null; relayout();
}

/* ----- pointer ----- */
function edDown(e){
  const t = e.target;
  if (t.closest("#edbar")){
    const b = t.closest("button[data-tab]"); if (!b) return;
    if (b.dataset.tab === "+"){ EDIT.sel = null; EDIT.panel = "new"; edPaint(true); return; }
    EDIT.sel = null; EDIT.panel = null; goEditPage(b.dataset.tab); return;
  }
  if (t.closest("#edpanel")) return panelDown(e);
  e.preventDefault();
  $("edl").focus({preventScroll:true});
  const act = t.closest("[data-act]");
  if (act){ boxAct(act.dataset.act, act); return; }
  const box = t.closest(".eslot"), pg = curPg(), s = box && pg.slots.find(v => v.id === box.dataset.slot);
  if (!s){ if (EDIT.sel || EDIT.panel){ EDIT.sel = null; EDIT.panel = null; edPaint(true); } return; }
  if (EDIT.panel === "add" && EDIT.addTo !== s.id){ EDIT.addTo = s.id; EDIT.sel = s.id; edPaint(true); return; }    // pick which box to add to
  if (EDIT.sel !== s.id){ EDIT.sel = s.id; EDIT.tile = live(s)[0] || null; EDIT.panel = null; }
  const [c, r] = cellAt(e.clientX, e.clientY);
  if (t.dataset.h) EDIT.drag = {k:"rs", s, dir:t.dataset.h, orig:{x:s.x, y:s.y, w:s.w, h:s.h}, snap:JSON.stringify(CFG)};
  else EDIT.drag = {k:"pend", s, x0:e.clientX, y0:e.clientY, dc:c - s.x, dr:r - s.y};
  edPaint(true);
}
function boxAct(a, el){
  if (a.startsWith("dz")) return designAct(a, el);
  const s = selSlot(), id = el && el.dataset.id;
  if (a === "up" || a === "dn") return stackAct(a, id);
  if (a === "ts" && s){ remember(); const v = +el.dataset.v; if (v === 1) delete s.ts; else s.ts = v; live(s).forEach(x => render(x)); edPaint(true); return; }
  if (a === "del" && s) removeBox(s);
  else if (a === "rmtile" && EDIT.tile) removeTile(EDIT.tile);
  else if (a === "desel"){ EDIT.sel = null; EDIT.tile = null; edPaint(true); }
  else if (a === "selbox"){ EDIT.sel = id; EDIT.tile = null; edPaint(true); }
  else if (a === "back"){ EDIT.panel = null; EDIT.addTo = null; edPaint(true); }
  else if (a === "add"){ EDIT.panel = "add"; EDIT.addTo = s ? s.id : null; edPaint(true); }
  else if (a === "setup") openSetup(el.dataset.kind);
  else if (a.startsWith("ent")) entAct(a, el);
  else if (a === "ai"){ const m = MODULES[EDIT.tile]; copyText(aiPrompt(m && m.s.ask)); }
  else if (a === "fit" && s){ const pg = curPg(), [dw, dh] = tsize(EDIT.tile || s.mod), R = {x:Math.min(s.x, GC - dw), y:Math.min(s.y, GR - dh), w:dw, h:dh};
    if (blocked(pg, R, s)){ flash("Not enough room here for its usual size"); return; } remember(); Object.assign(s, R); relayout(); }
  else if (a === "grow" && s) growFree(s);
  else if (a === "box") addEmptyBox();
  else if (a === "delpage"){
    const pg = curPg(); if (!pg || pg.id === "main" || pg.id === "night") return;
    remember(); (pg.slots || []).forEach(v => smods(v).forEach(dropTileItem));
    CFG.pages.settings.items = pgItems().filter(p => p !== pg); EDIT.sel = null;
    relayout(); goEditPage("main");
  }
}
function panelDown(e){
  const t = e.target, act = t.closest("[data-act]");
  if (t.closest("input,select,textarea") && !t.matches("button")) return;     // a switch or field inside a tappable row works on its own
  if (act){ e.preventDefault(); boxAct(act.dataset.act, act); return; }
  const pk = t.closest("[data-pick]");
  if (pk){ e.preventDefault(); EDIT.tile = pk.dataset.pick; stackTick(); edPaint(true); return; }
  const tp = t.closest("[data-tpl]");
  if (tp){ e.preventDefault(); remember(); const pg = newPage(tp.dataset.tpl); EDIT.panel = null; EDIT.sel = null; relayout(); goEditPage("c:" + pg.id); return; }
  const tc = t.closest("[data-type]");
  if (tc){ e.preventDefault(); EDIT.drag = {k:"tile", type:tc.dataset.type, x0:e.clientX, y0:e.clientY, started:false}; }
}
function edMove(e){
  const D = EDIT.drag; if (!D) return;
  const x = e.clientX, y = e.clientY, pg = curPg(), ph = $("edph");
  if (D.k === "pend" && Math.hypot(x - D.x0, y - D.y0) > 6){ D.k = "mv"; D.snap = JSON.stringify(CFG); document.body.classList.add("ed-drag"); }
  if (D.k === "mv"){
    const [c, r] = cellAt(x, y), s = D.s;
    const R = {x:Math.max(0, Math.min(GC - s.w, c - D.dc)), y:Math.max(0, Math.min(GR - s.h, r - D.dr)), w:s.w, h:s.h};
    const o = document.querySelector('.eslot[data-slot="' + s.id + '"]');
    if (o) o.classList.add("moving");
    const g = $("edghost"); g.textContent = boxName(s); g.hidden = false;
    g.style.left = (x + 14) + "px"; g.style.top = (y + 10) + "px";
    const under = (pg.slots || []).find(v => v !== s && c >= v.x && c < v.x + v.w && r >= v.y && r < v.y + v.h);
    if (!blocked(pg, R, s)) D.to = {k:"move", R};
    else if (under) D.to = {k:"swap", R:under, with:under};
    else D.to = null;
    showPh(D.to ? D.to.R : R, D.to ? D.to.k : "bad", D.to && D.to.k === "swap" ? "Swap" : D.to ? "" : "No room");
  } else if (D.k === "rs"){
    const [c, r] = cellAt(x, y), s = D.s, o = D.orig, d = D.dir, [minW, minH] = bmin(s);
    let x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h;
    if (d.includes("e")) x1 = Math.max(x0 + minW, Math.min(GC, c + 1));
    if (d.includes("w")) x0 = Math.min(x1 - minW, Math.max(0, c));
    if (d.includes("s")) y1 = Math.max(y0 + minH, Math.min(GR, r + 1));
    if (d.includes("n")) y0 = Math.min(y1 - minH, Math.max(0, r));
    // stop at neighbors: walk each moving edge back toward where it started until it fits
    const T = () => ({x:x0, y:y0, w:x1 - x0, h:y1 - y0});
    const step = (get, set, target) => { while (blocked(pg, T(), s) && get() !== target) set(get() + (target > get() ? 1 : -1)); };
    step(() => x1, v => { x1 = v; }, o.x + o.w); step(() => x0, v => { x0 = v; }, o.x);
    step(() => y1, v => { y1 = v; }, o.y + o.h); step(() => y0, v => { y0 = v; }, o.y);
    if (!blocked(pg, T(), s)){
      const R = T();
      if (R.x !== s.x || R.y !== s.y || R.w !== s.w || R.h !== s.h){ Object.assign(s, R); const el = pgSec().querySelector('[data-slot="' + s.id + '"]'); if (el) placeSlot(el, s); edPaint(true); }
    }
    document.body.classList.add("ed-drag");
  } else if (D.k === "tile"){
    if (!D.started && Math.hypot(x - D.x0, y - D.y0) > 6){ D.started = true; const g = $("edghost"); g.textContent = TYPES[D.type].title; g.hidden = false; document.body.classList.add("ed-drag"); }
    if (!D.started) return;
    const g = $("edghost"); g.style.left = (x + 14) + "px"; g.style.top = (y + 10) + "px";
    const G = pgGrid(), inside = x >= G.r.left && x <= G.r.right && y >= G.r.top && y <= G.r.bottom;
    D.to = null;
    if (inside){
      const [c, r] = cellAt(x, y), under = (pg.slots || []).find(v => c >= v.x && c < v.x + v.w && r >= v.y && r < v.y + v.h);
      if (under) D.to = {k:"into", s:under, R:under};
      else { const R = fitAt(pg, TYPES[D.type].size, c, r); if (R) D.to = {k:"new", R}; }
      showPh(D.to ? D.to.R : {x:c, y:r, w:1, h:1}, D.to ? (D.to.k === "into" ? "swap" : "move") : "bad",
        D.to ? (D.to.k === "into" ? (live(under).length ? "Take turns with " + boxName(under) : "Put here") : "") : "No room");
    } else $("edph").hidden = true;
  }
}
function showPh(R, kind, txt){
  const ph = $("edph"); Object.assign(ph.style, px(cellRect(R))); ph.className = kind; ph.hidden = false;
  ph.firstChild.textContent = txt || "";
}
function edUp(){
  const D = EDIT.drag; EDIT.drag = null;
  document.body.classList.remove("ed-drag"); $("edph").hidden = true; $("edghost").hidden = true;
  if (!D) return;
  if (D.k === "mv"){
    const s = D.s;
    if (D.to && D.to.k === "move" && (D.to.R.x !== s.x || D.to.R.y !== s.y)){ remember(); Object.assign(s, D.to.R); relayout(); return; }
    if (D.to && D.to.k === "swap"){       // the two boxes trade places (and sizes)
      remember(); const o = D.to.with, a = {x:s.x, y:s.y, w:s.w, h:s.h};
      Object.assign(s, {x:o.x, y:o.y, w:o.w, h:o.h}); Object.assign(o, a); relayout(); return;
    }
    edPaint(true); return;
  }
  if (D.k === "rs"){
    if (JSON.stringify(D.orig) !== JSON.stringify({x:D.s.x, y:D.s.y, w:D.s.w, h:D.s.h})){
      EDIT.hist.push(D.snap); EDIT.fut = []; relayout();
    } else edPaint(true);
    return;
  }
  if (D.k === "tile"){
    if (!D.started) return addTileAnywhere(D.type);          // a tap on a tile in the list
    if (!D.to) return;
    if (D.to.k === "into") addTile(D.type, D.to.s);
    else addTile(D.type, Object.assign({id:"s" + Date.now().toString(36), mod:null}, D.to.R));
  }
}

addEventListener("keydown", e => {
  if (!EDIT.on) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if (mod && (k === "z" || k === "Z")){ e.preventDefault(); undo(e.shiftKey ? -1 : 1); return; }
  if (mod && k === "y"){ e.preventDefault(); undo(-1); return; }
  if (mod && k === "s"){ e.preventDefault(); editExit(true); return; }
  if (k === "Escape"){ if (EDIT.panel){ EDIT.panel = null; EDIT.addTo = null; edPaint(true); } else if (EDIT.sel){ EDIT.sel = null; EDIT.tile = null; edPaint(true); } return; }
  const s = selSlot(); if (!s) return;
  if (k === "Delete" || k === "Backspace"){ e.preventDefault(); removeBox(s); return; }
  const dv = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[k]; if (!dv) return;
  e.preventDefault();
  const [mw, mh] = bmin(s), R = {x:s.x, y:s.y, w:s.w, h:s.h};
  if (e.shiftKey){ R.w += dv[0]; R.h += dv[1]; if (R.w < mw || R.h < mh) return; }
  else { R.x += dv[0]; R.y += dv[1]; }
  if (!inGrid(R) || blocked(curPg(), R, s)) return;
  remember(); Object.assign(s, R); relayout();

// hold a tile for ~0.7 s to start editing with it selected (like an iPhone home screen); in the Controls preview a plain tap does it
let holdT = null, holdAt = null;
document.addEventListener("pointerdown", e => {
  if (EDIT.on || SOLO) return;
  if (e.target.closest("input,textarea,select,button,a,[contenteditable],[data-ha]")) return;   // fields and controls never start edit mode
  const c = e.target.closest("[data-mod],.slot"); if (!c) return;
  holdAt = [e.clientX, e.clientY];

/* ---------- tile designer: a tile with parts() (Clock, Weather now, Night clock) can be laid out freely ----------
   design = {on, parts:{id:{x, y, s, a, c, f, ff, w, tt, ls, it, hide, noemoji, set}}}: x/y in % of the tile (x is the
   left, middle or right edge, per a = l|c|r), s = text size in % of the tile's height. */
// Saved designs live in one library per tile type (tiles.settings.designs = {clock:[{id, name, parts}]}), so a design
// can be picked like a style by any tile of that type. A tile using one has design = {on, ref, name, parts}; the
// parts there are a copy, kept in step when the design is saved, so the tile still draws if the library is lost.
const clone = o => JSON.parse(JSON.stringify(o));
function designLib(type){
  const t = CFG.tiles = CFG.tiles || {on:true, settings:{}}; t.settings = t.settings || {};
  const L = t.settings.designs = t.settings.designs && typeof t.settings.designs === "object" && !Array.isArray(t.settings.designs) ? t.settings.designs : {};
  return (L[type] = Array.isArray(L[type]) ? L[type] : []);
}
function designOf(m){
  const d = m && m.s && m.s.design; if (!d || !d.on || !m.parts) return null;
  const L = designLib(m.type); if (!d.ref) d.ref = "d_" + m.id;
  let x = L.find(v => v.id === d.ref);
  if (!x && d.parts){ x = {id:d.ref, name:d.name || "My " + TYPES[m.type].title.toLowerCase(), parts:clone(d.parts)}; L.push(x); }
  return x || null;
}
function designed(m){ return !!designOf(m); }
// after a design is saved, renamed or deleted: bring every tile that uses it up to date
function designSync(type, ref){
  const x = designLib(type).find(v => v.id === ref);
  for (const it of tileItems()){ const d = it.type === type && it.settings && it.settings.design; if (!d || d.ref !== ref) continue;
    if (x){ d.name = x.name; d.parts = clone(x.parts); } else delete it.settings.design; }
}
const designUsers = (type, ref) => tileItems().filter(it => it.type === type && it.settings && it.settings.design && it.settings.design.on && it.settings.design.ref === ref).length;
function designName(type, base){ const L = designLib(type); let n = base, i = 2; while (L.some(v => v.name === n)) n = base + " " + i++; return n; }
const stripEmoji = h => String(h).replace(EMO, "").replace(/ {2,}/g, " ").trim();
function wxSymbol(code, night){
  const t = wx(code, night).t;
  if (/Storm/.test(t)) return "ϟ"; if (/Snow/.test(t)) return "❄︎"; if (/Rain|Drizzle|Showers/.test(t)) return "☂︎";
  if (/Fog/.test(t)) return "≋"; if (/Overcast|cloudy/i.test(t) && !/Mostly clear/.test(t)) return "☁︎"; return night ? "☾" : "☀︎";
}
// A design is drawn on a canvas the height of the box it was made in (D.rows grid rows): sizes and the distance from
// the top are a share of that height. In a shorter box the text keeps its size and the empty space at the bottom
// goes first; only when the parts no longer fit does everything shrink together. A taller box scales it up.
function designSlot(m){ const h = MOUNTED[m.id], b = h && h.parentNode; return b && b.dataset && b.dataset.slot ? slotById(b.dataset.slot) : null; }
function designBasis(el, m, D){

  if (mod && (e.key === "z" || e.key === "Z")){ e.preventDefault(); e.stopImmediatePropagation(); undo(e.shiftKey ? -1 : 1); if (dzM()) designPaint(); else designEnd(); return; }
  if (e.key === "Escape"){ e.stopImmediatePropagation(); if (EDIT.focus.sel){ EDIT.focus.sel = null; edPaint(true); designPaint(); } else designEnd(true); return; }
  const o = EDIT.focus.sel && dzX() && dzX().parts[EDIT.focus.sel];
  const dv = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key];
  e.stopImmediatePropagation();
  if (!o || !dv) return;
  e.preventDefault(); remember();
  const st = e.shiftKey ? 2 : .5; o.x = +(o.x + dv[0] * st).toFixed(1); o.y = +(o.y + dv[1] * st).toFixed(1);
  designPaint();
}, true);

/* ---------- made-up data for the tile store's examples (?solo=<tile>): nothing about the owner shows ---------- */
function demoJSON(u){
  const now = new Date(), day = n => { const d = new Date(now); d.setDate(d.getDate() + n); return d; };
  const iso = (d, h, m) => { const x = new Date(d); x.setHours(h, m || 0, 0, 0); const p = v => String(v).padStart(2, "0");
    return x.getFullYear() + "-" + p(x.getMonth() + 1) + "-" + p(x.getDate()) + "T" + p(x.getHours()) + ":" + p(x.getMinutes()) + ":00"; };
  if (/api\.open-meteo\.com/.test(u)){
    const base = new Date(now); base.setMinutes(0, 0, 0);
    const H = {time:[], temperature_2m:[], precipitation_probability:[], weather_code:[], is_day:[]};
    for (let i = -30; i < 48; i++){
      const d = new Date(base.getTime() + i * 3600e3), h = d.getHours();
      H.time.push(iso(d, h).slice(0, 16)); H.temperature_2m.push(Math.round(58 + 10 * Math.sin((h - 9) / 24 * 2 * Math.PI)));
      H.precipitation_probability.push(i > 6 && i < 11 ? 55 : 5); H.weather_code.push(i > 6 && i < 11 ? 61 : 2); H.is_day.push(h >= 7 && h < 18 ? 1 : 0);
    }
    const D = {time:[], temperature_2m_max:[], temperature_2m_min:[], weather_code:[], precipitation_probability_max:[], sunrise:[], sunset:[]};
    [2, 61, 3, 1, 0, 2, 3, 1].forEach((c, i) => { const d = day(i), k = iso(d, 0).slice(0, 10);
      D.time.push(k); D.temperature_2m_max.push(66 + (i % 3) * 2); D.temperature_2m_min.push(47 + (i % 2) * 3); D.weather_code.push(c);
      D.precipitation_probability_max.push(c === 61 ? 60 : 10); D.sunrise.push(k + "T06:52"); D.sunset.push(k + "T17:31"); });
    const h = now.getHours();
    return {current:{temperature_2m:62, weather_code:2, is_day: h >= 7 && h < 18 ? 1 : 0}, hourly:H, daily:D};
  }
  if (/air-quality/.test(u)) return {current:{us_aqi:28}};
  if (/^\/events/.test(u)) return {events:[
    {summary:"Soccer practice", start:iso(day(0), 18, 30)}, {summary:"Dentist", start:iso(day(1), 9)},
    {summary:"Book club", start:iso(day(2), 19)}, {summary:"Farmers market", start:iso(day(4), 0).slice(0, 10), allDay:true},
    {summary:"Movie night", start:iso(day(5), 20)}]};
  if (/^\/notes/.test(u)) return {list:"Grocery", source:"reminders", note:"", items:["Milk", "Eggs", "Bread", "Coffee", "Bananas", "Pasta"].map((t, i) => ({id:"d" + i, text:t, done:false}))};
  if (/^\/sales/.test(u)) return {watching:30, at:Math.floor(now / 1000), deals:[
    {want:"Coffee", why:"onlist", name:"House blend coffee 12 oz", store:"Corner Market", price:"$6.99", now:6.99, usual:8.49},
    {want:"x", why:"usual", name:"Sparkling water 12-pk", store:"Big Box", price:"3/$12.00", now:4, usual:5.29},
    {want:"x", why:"usual", name:"Tortilla chips", store:"Corner Market", price:"$2.50", now:2.5, usual:3.99},
    {want:"x", why:"usual", name:"Vanilla ice cream", store:"Big Box", price:"$3.99", now:3.99, usual:5.49},
    {want:"x", why:"usual", name:"Breakfast sausage", store:"Warehouse Club", price:"$7.98", now:7.98, usual:9.48}]};
  if (/^\/team/.test(u)){
    const g = (n, opp, home) => ({date:new Date(iso(day(n), 19)).toISOString(), home, opp, note:"League match"});
    return {team:"Home FC", upcoming:[g(3, "River City", true), g(8, "Lakeside", false), g(13, "Northport", true)],
      next:Object.assign(g(3, "River City", true), {us:null, them:null, done:false, live:false, venue:"Home Stadium"}),
      last:{date:day(-4).toISOString(), home:false, opp:"Lakeside", us:2, them:1, done:true, winner:true, note:"League match"}};
  }
  if (/^\/photos/.test(u)) return {photos:[]};
  if (/^\/planes/.test(u)){ const g = S("general"), P = (f, t, dx, dy, alt, tr) => ({flight:f, type:t, desc:t, lat:g.lat + dy / 69, lon:g.lon + dx / 53, alt, speed:420, track:tr});
    return {planes:[P("SWA1234", "Boeing 737-800", 2, 1, 9800, 80), P("DAL88", "Airbus A321", -6, 4, 24000, 260), P("N512CP", "Cessna 172", 1, -3, 2500, 10), P("UAL301", "Boeing 787-9", 9, -7, 35000, 300)], error:null}; }
  if (/^\/stocks/.test(u)){ const q = (sym, name, price, prev) => ({sym, name, price, prev, spark:[...Array(40)].map((_, i) => +(prev + (price - prev) * i / 39 + Math.sin(i / 3) * prev * .002).toFixed(2))});
    return {stocks:[q("^GSPC", "S&P 500", 5932.1, 5901.4), q("^DJI", "Dow Jones", 43210.5, 43350.2), q("ACME", "Acme Corp", 182.44, 179.9)]}; }
  if (/^\/reddit/.test(u)){ const svg = c => "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><defs><linearGradient id="a" x2="0" y2="1"><stop offset="0" stop-color="' + c + '"/><stop offset="1" stop-color="#1b2a3a"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#a)"/><path d="M0 760 L380 420 L640 640 L980 300 L1600 820 L1600 1000 L0 1000Z" fill="#20303f"/></svg>');
    return {posts:[{title:"Sunrise over the ridge after a cold night [4000x2667]", img:svg("#f4a259"), by:"hiker", score:5100}, {title:"Fog in the valley this morning", img:svg("#8fb8de"), by:"walker", score:3900}], error:null}; }
  return undefined;     // anything else (meal ideas, cams, radar, space) holds nothing personal
}

/* ---------- look & feel: emoji or plain text, swapped emoji, 24-hour time ---------- */
const LOOK = {plain:false, mode:"emoji", swaps:[], h24:false, ready:false};
const EMO = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|[\u{1F3FB}-\u{1F3FF}]|‍(?:\p{Extended_Pictographic}|\p{Emoji_Component}))*️?/gu;
// "Simple symbols": the emoji that carry information (weather, sun, moon) become one-color text symbols; the rest go
const SYM = {"☀":"☀︎", "🌤":"☀︎", "⛅":"☁︎", "🌥":"☁︎", "☁":"☁︎", "🌦":"☂︎", "🌧":"☂︎", "☔":"☂︎", "☂":"☂︎", "⛈":"ϟ", "🌩":"ϟ", "⚡":"ϟ",
  "🌨":"❄︎", "❄":"❄︎", "☃":"❄︎", "🌫":"≋", "🌙":"☾", "🌛":"☾", "🌜":"☾", "🌑":"●", "🌒":"☾", "🌓":"☾", "🌔":"☾", "🌕":"○", "🌖":"☾", "🌗":"☾", "🌘":"☾",
  "🌅":"↑", "🌄":"↑", "🌇":"↓", "🌆":"↓"};
const WORDS = {"🌅":"Sunrise", "🌄":"Sunrise", "🌇":"Sunset", "🌆":"Sunset"};     // "Words only" keeps what these meant
const EMOX = new RegExp("(?:" + EMO.source + ")\uFE0E?", "gu");      // also takes a symbol's own text marker, so a second pass changes nothing
function lookText(s){
  if (!s || !LOOK.ready) return s;
  let t = s;
  for (const [a, b] of LOOK.swaps) if (a && t.includes(a)) t = t.split(a).join(b);
  if (LOOK.plain){
    const sym = LOOK.mode === "symbols", u = t.replace(EMOX, m => { const k = m.replace(/[\uFE0E\uFE0F]/g, ""); return (sym ? SYM[k] : WORDS[k]) || ""; });
    if (u !== t) t = u.replace(/ {2,}/g, " ").replace(/^ (?=\S)/, "");
  }
  return t;
}
function lookApply(root){
  if (!LOOK.ready || (!LOOK.plain && !LOOK.swaps.length)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()){
    if (n.parentNode && n.parentNode.closest && n.parentNode.closest("#edl,script,style")) continue;
    const v = lookText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v;
  }
}
/* ---------- looks: the everyday look, other looks, and schedule rules that switch to them; the last matching rule wins ---------- */
const FORCE_THEME = (location.search.match(/[?&]theme=([\w-]+)/) || [])[1] || "";
function themeMatches(t, d){
  const w = t.when || {};
  if (t.on === false) return false;
  if (w.from && w.to && w.from !== w.to){
    const hm = d.getHours() * 60 + d.getMinutes(), m = x => { const [h, mi] = String(x).split(":").map(Number); return h * 60 + (mi || 0); };
    const a = m(w.from), b = m(w.to);
    if (a < b ? !(hm >= a && hm < b) : !(hm >= a || hm < b)) return false;
  }
  if (w.days && w.days.length && !w.days.includes(d.getDay())) return false;
  if (w.dFrom && w.dTo){
    const k = (d.getMonth() + 1) * 100 + d.getDate(), n = x => { const [mo, da] = String(x).split("-").map(Number); return mo * 100 + da; };
    const a = n(w.dFrom), b = n(w.dTo);
    if (a <= b ? !(k >= a && k <= b) : !(k >= a || k <= b)) return false;
  }
  return true;
}
function activeTheme(d){
  const L = S("look"), items = L.items || [], rules = L.rules || [];
  if (FORCE_THEME) return FORCE_THEME === "default" ? null : items.find(t => t.id === FORCE_THEME) || null;
  if (SOLO) return null;
  for (let i = rules.length - 1; i >= 0; i--){ const r = rules[i], t = items.find(x => x.id === r.look); if (t && themeMatches(r, d || new Date())) return t; }
  return null;
}
let THEME = null, THEMEV = {};
const PREFS = ["dateFmt", "weekStart", "h24", "emoji", "swap"];      // set once in Setup, the same in every look
function themeValues(){
  const base = Object.assign({}, S("look")); delete base.items; delete base.rules;
  THEME = activeTheme();
  const v = Object.assign(base, THEME ? THEME.values || {} : {}), g = S("general");
  PREFS.forEach(k => { if (g[k] !== undefined) v[k] = g[k]; });
  return v;
}
function hexA(hex, a){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return null;
  const n = parseInt(m[1], 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}
function themeApply(){
  const v = THEMEV = themeValues(), R = document.documentElement, st = R.style;
  const light = v.mode === "Light";
  R.classList.toggle("light", light);
  R.classList.toggle("notitles", v.titles === false);
  if (v.accent) st.setProperty("--accent", v.accent);
  const op = v.tiles === "Clear" ? 0 : v.tiles === "See-through" ? (v.opacity || 60) / 100 : light ? .9 : .84;
  st.setProperty("--card", light ? "rgba(250,251,253," + op + ")" : "rgba(18,22,28," + op + ")");
  R.classList.toggle("clear", v.tiles === "Clear");
  const ts = (v.textScale || 100) / 100;
  st.setProperty("--ts", ts); R.classList.toggle("tscale", ts !== 1);
  if (v.bg === "Color" && v.bgColor) st.setProperty("--bg", v.bgColor);
  if (v.bg !== "Sky"){ FXCFG.sky = false; $("skyA").style.background = "var(--bg)"; $("skyB").style.opacity = 0; }
  if (v.fx === "Off") FXCFG.any = false;
  let dm = $("dimmer"); if (!dm){ dm = document.createElement("div"); dm.id = "dimmer"; document.body.appendChild(dm); }
  dm.style.opacity = (v.dim || 0) / 100;
}
// background photos (Background: Photos) come from the first photo album in Setup
function themePhotos(){
  if (THEMEV.bg !== "Photos") return;
  const A = STATE.albums[""] || Object.values(STATE.albums)[0], P = (A && A.photos) || [];
  if (!P.length) return;
  const ph = P[Math.floor(Date.now() / 300e3) % P.length];
  $("skyA").style.background = 'center/cover no-repeat url("' + ph.url + '")';
}
function themeTick(){       // a different theme's time has come: start fresh with it
  if (FORCE_THEME || SOLO || EDIT.on) return;
  const t = activeTheme();
  if ((t && t.id) !== (THEME && THEME.id)) location.reload();
}
function fmtLongDate(d){
  const f = THEMEV.dateFmt;
  if (f === "Wed, Nov 18") return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  if (f === "18 November") return d.getDate() + " " + d.toLocaleDateString([], {month:"long"});
  if (f === "11/18") return (d.getMonth() + 1) + "/" + d.getDate();
  return d.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
function lookSetup(){
  themeApply();
  const s = THEMEV;
  LOOK.mode = s.emoji === "No emoji" ? "none" : s.emoji === "Simple symbols" ? "symbols" : "emoji";
  LOOK.plain = LOOK.mode !== "emoji";
  LOOK.swaps = (s.swap || []).map(x => String(x).split("=")).filter(p => p.length === 2).map(p => [p[0].trim(), p[1].trim()]).filter(p => p[0]);
  LOOK.h24 = !!s.h24;
  LOOK.ready = true;
  if (LOOK.h24){
    const t = Date.prototype.toLocaleTimeString;
    Date.prototype.toLocaleTimeString = function(l, o){
      o = Object.assign({}, o || {}, {hourCycle:"h23", hour12:false});
      if (o.hour && !o.minute) o.minute = "2-digit";          // "19" alone reads oddly; show "19:00"
      return t.call(this, l, o);
    };
  }
  if (LOOK.plain || LOOK.swaps.length){
    // text on canvases too (charts), but not the falling-leaves effects layers
    const f = CanvasRenderingContext2D.prototype.fillText;
    CanvasRenderingContext2D.prototype.fillText = function(txt, x, y, mw){
      const id = this.canvas && this.canvas.id;
      return f.call(this, id === "fx" || id === "fun2" ? txt : lookText(String(txt)), x, y, mw);
    };
    let busy = false;
    new MutationObserver(ms => {
      if (busy) return; busy = true;
      try{ for (const m of ms){ if (m.type === "characterData") lookApply(m.target.parentNode || m.target); else m.addedNodes.forEach(n => n.nodeType === 3 ? (n.parentNode && lookApply(n.parentNode)) : n.nodeType === 1 && lookApply(n)); } }
      finally{ busy = false; }
    }).observe(document.body, {subtree:true, childList:true, characterData:true});
    lookApply(document.body);
  }
}
