<script>
/* separate block on purpose: if the main script below has a syntax error, this one still reports it */
window.addEventListener("error", function(e){
  if (window.__mainLoaded) return;
  try{ fetch("/report", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({task:"js-error", ok:false, error:"boot: " + e.message, result:{src:e.filename, line:e.lineno, page:"dash2"}})}); }catch(x){}
});
</script>
