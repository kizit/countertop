<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>Dashboard settings</title>
<style>
  /* Settings-app pattern: grouped lists, one level of detail, Back to return. Layout is its own screen. */
  :root{--fg:#eef1f5;--dim:#9aa3ad;--faint:#636c77;--bg:#0d1014;--group:#191e25;--line:#2a313a;--accent:#5aa9ff;--ok:#4cd27a;--bad:#ff6b6b;--hl:#22303f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:17px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .app{min-height:100%}
  .nav{max-width:720px;margin:0 auto;padding:0 16px 80px}
  .bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    padding:max(10px,env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 80%,rgba(13,16,20,0))}
  .bar h1{grid-column:2;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .l{justify-self:start;grid-column:1;grid-row:1} .bar .r{justify-self:end;grid-column:3;grid-row:1}
  .link{color:var(--accent);font-size:17px;padding:8px 4px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .link[hidden]{display:none}
  .big{font-size:32px;font-weight:700;margin:6px 4px 14px}
  .sec{margin:22px 0 0}
  .sec > h2{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:0 16px 7px}
  .sec > .foot{font-size:13px;color:var(--faint);margin:7px 16px 0}
  .grp{background:var(--group);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px 8px 16px;position:relative;width:100%;text-align:left}
  .row + .row::before,.gap + .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
  .row.tap{cursor:pointer} .row.tap:hover{background:var(--hl)}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-weight:400}
  .row .t small{display:block;color:var(--faint);font-size:13px;margin-top:1px}
  .row .v{color:var(--dim);font-size:15px;white-space:nowrap}
  .row .chev{color:var(--faint);font-size:20px;margin-left:2px}
  .row.off .t b{color:var(--faint)}
  .row.col{flex-direction:column;align-items:stretch;gap:8px;padding-top:12px;padding-bottom:12px}
  .sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:#3a424c;transition:background .2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
  .sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
  select,input[type=text],input[type=number],textarea{font:inherit;color:var(--fg);background:#232a33;border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;max-width:100%}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  input[type=number]{width:96px;text-align:right}
  input[type=text],textarea{width:100%}
  textarea{min-height:84px;resize:vertical}
  textarea.code{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;min-height:240px;white-space:pre;tab-size:2}
  .seg{display:inline-flex;background:#232a33;border-radius:9px;padding:2px;flex:none}
  .seg button{padding:5px 12px;border-radius:7px;font-size:14px;color:var(--dim)}
  .seg button.on{background:#3d4652;color:var(--fg)}
  .row.add b{color:var(--accent)}
  .btnrow{display:block;width:100%;text-align:center;padding:14px;font-size:17px}
  .btnrow.red{color:var(--bad)} .btnrow.blue{color:var(--accent)}
  .minus{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:18px;line-height:22px;text-align:center;font-weight:700}
  .btnrow.pri{background:var(--accent);color:#06121f;font-weight:600}
  .emopt{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .emopt:last-child{border-bottom:0}
  .emopt input{width:20px;height:20px;accent-color:var(--accent,#5aa9ff);flex:none}
  .emopt .t{display:flex;flex-direction:column;gap:3px}
  .emopt .ex{font-size:14px;color:var(--dim)}
  .emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;background:var(--group);border-radius:12px;padding:10px}
  .lnk{color:var(--accent);font-size:15px;flex:none}
  .emp{font-size:28px;line-height:1;height:48px;border-radius:10px;background:none}
  .emp:hover{background:#2a313b}
  .emp.on{background:#3d4652;box-shadow:inset 0 0 0 2px var(--accent,#5aa9ff)}
  .row.swp{gap:10px}
  .emb{font-size:26px;min-width:52px;height:46px;border-radius:10px;background:#232a33;padding:0 8px}
  .emb.none{font-size:14px;color:var(--dim)}
  .row.swp .arr{color:var(--dim);font-size:18px}
  .embig{font-size:26px;vertical-align:middle}
  html.echo body{zoom:1.3}
  .intro{color:var(--dim);font-size:15px;margin:0 4px 6px}
  .help{color:var(--faint);font-size:13px;line-height:1.4}
  .dot{flex:none;width:12px;height:12px;border-radius:50%}
  .saverow{display:flex;gap:10px;margin-top:16px}
  .saverow button{flex:1;padding:13px;border-radius:12px;background:var(--group);font-weight:600}
  .saverow button.pri{background:var(--accent);color:#06121f}
  /* a list's items (Controls → Lists) */
  .lladd{display:flex;gap:8px}
  .lladd input{flex:1;min-width:0}
  .lladd button{flex:none;padding:10px 14px;font-size:15px}
  .ll-x{flex:none;background:none;border:0;color:var(--dim);font-size:24px;line-height:1;padding:4px 10px;cursor:pointer}
  .ll-x:active{color:var(--bad)}
  .llb{flex:none;font-size:14px;padding:6px 12px;border-radius:10px;background:var(--group);color:var(--dim);cursor:pointer}
  #pvedit{background:var(--accent);color:#06121f;font-weight:600;border-radius:9px;padding:6px 14px;font-size:14px}
  #pvedit.on{background:#2a313b;color:var(--dim)}
  /* preview */
  .pv{padding:0 16px 24px}
  .pvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0 10px}
  .pvbar .note{color:var(--faint);font-size:13px;margin-left:auto}
  .pvbox{position:relative;width:100%;margin-inline:auto;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .pvbox iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
  @media (min-width:1100px){
    body.desk .app{display:grid;grid-template-columns:440px 1fr;align-items:start}
    body.desk .nav{margin:0;max-width:none;border-right:1px solid var(--line);min-height:100vh}
    body.desk .pv{position:sticky;top:0;padding:0 24px 24px}
  }
  @media (max-width:699px){ .pv{display:none} }
  .lcard img,.starterfigure img,.blankpreview{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:7px}
  .blankpreview{position:relative;background:#141a21;border:1px dashed #566170}
  .blankpreview i{position:absolute;border:1px dashed var(--accent);border-radius:4px;background:#202f40}
  .gridheading{margin:24px 4px 0;color:var(--faint);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .starterfigure{margin:0}.starterfigure figcaption{font-weight:600;padding:12px 0}
  #starterpv{display:none}
  @media (min-width:850px){
    body.desk.showstarter .app{display:grid;grid-template-columns:min(35vw,440px) minmax(0,1fr);align-items:start}
    body.desk.showstarter .nav{margin:0;max-width:none}
    body.desk.showstarter .pv{position:sticky;top:0}
    body.desk.showstarter #starterpv{display:block}
    body.desk.showstarter .pvbar,body.desk.showstarter .pvbox,body.desk .compactpreview{display:none}
  }
  @media (max-width:849px){body.showstarter .pv{display:none}}
  /* looks: picture cards */
  .lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
  .lcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--group);border-radius:12px;padding:8px 8px 10px;border:2px solid transparent}
  .lcard.now{border-color:var(--accent)}
  .lcard b{font-weight:600;font-size:15px;margin:4px 2px 0} .lcard small{color:var(--faint);font-size:12px;margin:0 2px}
  .lpic{position:relative;width:100%;aspect-ratio:16/9;border-radius:7px;overflow:hidden;font-size:7px}
  .lpic.big{font-size:16px;border-radius:12px;margin:4px 0 6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .lpic.plus{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--accent);background:#141a21;border:1px dashed #33404e}
  .lpic i{position:absolute;border-radius:.6em;border:1px solid transparent;padding:.5em .7em;display:flex;flex-direction:column;gap:.45em;overflow:hidden}
  .lpic i.dm{inset:0;border-radius:0;padding:0;border:0}
  .lpic s{display:block;width:30%;height:.4em;border-radius:.2em;opacity:.7}
  .lpic em{font-style:normal;font-weight:600;line-height:1}
  .lpic u{display:block;border-radius:.25em;opacity:.55}
  .lpic b{display:block;width:22%;height:.5em;border-radius:.25em}
  /* page thumbnails: each box of the page, drawn in the current look */
  .lpic i.slot{padding:.5em .6em}
  .lpic i.slot s{width:40%}
  .pthumb{flex:none;width:72px;font-size:2.6px;border-radius:5px}
  .lcard .lpic.page{font-size:4px}
  .starterfigure .lpic.page{font-size:12px}
  [data-pid]{transition:transform .15s}
  .row.drag{z-index:2;transition:none;background:#262e38;box-shadow:0 6px 24px rgba(0,0,0,.45);border-radius:10px}
  .grip.none{visibility:hidden}
  .grip{flex:none;align-self:stretch;display:flex;align-items:center;margin:-8px -6px -8px -10px;padding:0 6px;color:var(--faint);font-size:16px;letter-spacing:-3px;touch-action:none;cursor:grab}
  .tabs{margin:14px 0 0}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:#212832;border:2px solid transparent;font-size:14px}
  .opt.on{border-color:var(--accent);background:#1d2a39}
  .opt b{font-weight:500} .opt small{color:var(--faint);font-size:11px}
  .sample{display:block;width:100%;aspect-ratio:16/9;border-radius:6px;position:relative;overflow:hidden}
  .sample.tl{background:linear-gradient(180deg,#2f6aa3,#0d1a2b)}
  .sample.tl i{position:absolute;top:18%;bottom:18%;width:38%;border-radius:5px}
  .sample.tl i:first-child{left:8%} .sample.tl i + i{right:8%}
  .sample.solid i{background:rgba(18,22,28,.88)} .sample.see i{background:rgba(18,22,28,.45)} .sample.clear i{background:none;border:1px dashed rgba(255,255,255,.3)}
  .sws{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .swc{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .swc.on{border-color:#fff}
  input[type=color]{width:44px;height:32px;border:0;background:none;padding:0}
  input[type=range]{width:150px;accent-color:var(--accent)}
  .seg.wide{display:flex;width:100%} .seg.wide button{flex:1}
  details.more > summary{cursor:pointer;color:var(--accent);font-size:15px;margin:0 16px 8px;list-style:none}
  details.more > summary::before{content:"▸ "} details.more[open] > summary::before{content:"▾ "}
  /* effects library */
  .fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .fxc{background:var(--group);border-radius:12px;overflow:hidden;cursor:pointer}
  .fxc canvas{display:block;width:100%;aspect-ratio:16/9;background:#0b1022}
  .fxc.off canvas{opacity:.35}
  .fxc.big{cursor:default;margin:4px 0 12px} .fxc.big canvas{border-radius:12px}
  .fxt{display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
  .fxt > div{flex:1;min-width:0} .fxt b{display:block;font-weight:500;font-size:15px} .fxt small{color:var(--faint);font-size:12px}
  .fxt .sw{transform:scale(.8);transform-origin:right center}
  .nowtag{color:var(--ok)}
  #toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#232a33;z-index:60;
    border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;color:var(--dim);box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .3s;pointer-events:none}
  #toast.ok{color:var(--ok)} #toast.bad{color:var(--bad)}
  /* status + setup guide */
  .row.upd b{color:var(--accent);font-weight:600}
  a.btnrow{text-decoration:none;color:var(--accent)}
  .grp > a.btnrow + a.btnrow,.grp > .row + a.btnrow,.grp > .row + .btnrow{border-top:1px solid var(--line)}
  .wizdots{display:flex;gap:6px;margin:14px 4px 4px}
  .wizdots i{flex:1;height:4px;border-radius:2px;background:#2a313a}
  .wizdots i.done{background:#3d6a99} .wizdots i.on{background:var(--accent)}
  .saverow button[data-act="wizback"],.saverow button[data-act="wizskip"]{flex:.6}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="bar">
      <button class="link l" id="back" hidden>‹ <span id="backlbl">Settings</span></button>
      <h1 id="title"></h1>
      <a class="link r" id="done" href="/dash" target="_blank">Open dashboard</a>
    </div>
    <div id="screen"></div>
  </div>
  <div class="pv" id="pv" hidden>
    <div id="starterpv"></div>
    <div class="pvbar">
      <span class="seg" id="pvpage"></span>
      <button id="pvedit">Edit on screen</button>
      <span class="seg" id="pvsize" role="group" aria-label="Preview size"><button data-w="1920" data-h="1080" class="on" aria-pressed="true">Full screen</button><button data-w="1920" data-h="980" aria-pressed="false">With browser bar</button><button data-w="1080" data-h="1920" aria-pressed="false">Portrait</button></span>
      <span class="note"><span id="pvres">1920×1080</span> preview. Click a tile to change it.</span>
    </div>
    <div class="pvbox" id="pvbox"><iframe id="pvf" title="Dashboard preview" width="1920" height="1080"></iframe></div>
  </div>
</div>
<div id="toast" style="opacity:0"></div>
<script>
"use strict";
/* Controls: Setup (your location, calendars, lists, teams, albums, cams, store deals), Pages, and the look.
   Tiles themselves are added, arranged and set up on the dashboard: Edit on screen (or hold a tile on the screen). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ECHO = /[?&]echo=1/.test(location.search);
const MOUNTS = {auto:"Automatic", left:"Portrait · left edge up", right:"Portrait · right edge up"};
const SHELL = ECHO && window.parent !== window;
let displayMode = "auto";
let everyday, schema = {}, mods = {}, SRC = {}, KINDS = {}, saveTimer = null, stack = ["root"];
const KIND_ORDER = ["calendars", "lists", "teams", "albums", "cams", "homeassistant", "recipes"];

window.shellBusy = () => true;       // on the Echo, the shell must not reload the dashboard over Controls when a save changes the settings
if (ECHO){
  document.documentElement.classList.add("echo");
  $("done").textContent = "Done"; $("done").removeAttribute("target");
  document.addEventListener("pointerdown", () => { try{ window.top.shellTap && window.top.shellTap(); }catch(e){} });
  setInterval(() => { try{ window.top.contentTick && window.top.contentTick(); }catch(e){} }, 20e3);
}
$("done").href = displayHref();

function displayHref(edit){
  const url = new URL(SHELL ? "/dash/content" : "/dash", location.origin);
  if (edit) url.searchParams.set("edit", "1");
  return url.href;
}
function applyDisplayMode(mode){
  const changed = displayMode !== mode;
  displayMode = mode;
  if (changed && !ECHO){
    const height = mode === "auto" ? 1080 : 1920;
    pvSize($("pvsize").querySelector('[data-h="' + height + '"]'));
  }
}
async function displaySet(select){
  const mode = select.value;
  select.disabled = true;
  try{
    const r = await fetch("/config", {method:"POST", keepalive:true, headers:{"Content-Type":"application/json"}, body:JSON.stringify({orientation:mode})});
    if (!r.ok) throw new Error("HTTP " + r.status);
    applyDisplayMode((await r.json()).orientation);
    if (SHELL && window.parent.shellSetOrientation) window.parent.shellSetOrientation(displayMode);
    toast("Screen orientation saved", "ok");
  }catch(e){ select.value = displayMode; toast("Couldn't save orientation: " + e.message, "bad"); }
  finally{ select.disabled = false; }
}

function toast(msg, cls){
  const t = $("toast"); t.textContent = msg; t.className = cls || ""; t.style.opacity = 1;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.opacity = 0; }, cls === "bad" ? 8000 : 2200);
}
async function load(){
  try{
    const [j, s] = await Promise.all([fetch("/config?starters=1", {cache:"no-store"}).then(r => r.json()), fetch("/sources", {cache:"no-store"}).then(r => r.json())]);
    applyDisplayMode(j.orientation || "auto");
    everyday = j.everyday; schema = j.schema; mods = j.modules; SRC = s.sources || {}; KINDS = s.kinds || {};
    if (needsSetup() && stack.length === 1) stack = ["root", "wiz"];       // a new install: walk through the basics first
    await titlesLoad; show(); statusLoad();
  }catch(e){ toast("Can't reach the dashboard server", "bad"); }
}
function pvRefresh(){
  if (ECHO) return;
  let ed = false; try{ ed = pvWin().dashEditing(); }catch(e){}
  if (ed){ try{ pvWin().dashApply(mods); }catch(e){} } else pvLoad();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      const r = await fetch("/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({modules: mods})});
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || r.status);
      mods = j.modules;
      toast("Saved", "ok"); pvRefresh();
    }catch(e){ toast("Didn't save: " + e.message, "bad"); }
  }, 450);
}

/* ---------- helpers ---------- */
const U = 2, GC = 24 * U;
function gpAll(){
  if (!(mods.pages && mods.pages.settings)) return [];
  const L = mods.pages.settings.items = mods.pages.settings.items || [];
  for (const p of L) if (p.cols !== GC){ const f = GC / (p.cols || 12); (p.slots || []).forEach(s => { s.x *= f; s.y *= f; s.w *= f; s.h *= f; }); p.cols = GC; }
  return L;
}
// Saved layouts are switched-off pages marked saved: earlier versions of Main, kept to bring back later.
// ("Previous main" is what replacing Main used to leave behind.)
const isSaved = p => !!p.saved || (p.on === false && p.name === "Previous main");
const cpList = () => gpAll().filter(p => p.id !== "main" && p.id !== "night" && !isSaved(p));
const savedList = () => gpAll().filter(p => p.id !== "main" && p.id !== "night" && isSaved(p));
const savedById = id => savedList().find(p => p.id === id);
const cpById = id => cpList().find(p => p.id === id);
const smods = s => [s.mod].concat(s.more || []).filter(Boolean);
const tileList = () => (mods.tiles && mods.tiles.settings && mods.tiles.settings.items) || [];
const sw = (on, attrs) => '<button class="sw' + (on ? " on" : "") + '" role="switch" aria-checked="' + !!on + '" ' + attrs + '></button>';
function row(o){   // {t, sub, v, chev, cls, attrs, pre, post}
  return '<div class="row' + (o.chev ? " tap" : "") + (o.cls ? " " + o.cls : "") + '" ' + (o.attrs || "") + '>' + (o.pre || "") +
    '<div class="t"><b>' + esc(o.t) + '</b>' + (o.sub ? '<small>' + esc(o.sub) + '</small>' : "") + '</div>' +
    (o.v ? '<span class="v">' + esc(o.v) + '</span>' : "") + (o.post || "") + (o.chev ? '<span class="chev">›</span>' : "") + '</div>';
}
const sec = (title, body, foot) => '<div class="sec">' + (title ? '<h2>' + esc(title) + '</h2>' : "") + '<div class="grp">' + body + '</div>' + (foot ? '<div class="foot">' + esc(foot) + '</div>' : "") + '</div>';
const n = (k, c) => c + " " + (c === 1 ? KINDS[k].one : KINDS[k].title.toLowerCase());
function tileName(id){ const t = tileList().find(x => x.id === id); return t ? t.name || TITLES[t.type] || t.type : id; }
// which tiles use a source (a tile set to "all calendars" counts for every calendar)
function usedBy(kind, id){
  return tileList().filter(t => Object.values(t.settings || {}).some(v => v === id || Array.isArray(v) && v.includes(id))).map(t => t.name || TITLES[t.type] || t.type);
}
let TITLES = {};          // tile type -> its name, read from the tile files
const titlesLoad = fetch("/tiles.js").then(r => r.text()).then(t => { for (const m of t.matchAll(/(?:Tile|viewTile)\("(\w+)",\s*\{[^}]*?title:"([^"]+)"/g)) TITLES[m[1]] = m[2]; }).catch(() => {});

/* ---------- screens ---------- */

function uniqueName(base){
  const names = new Set(gpAll().map(p => p.name));
  let n = base; for (let i = 2; names.has(n); i++) n = base + " (" + i + ")";
  return n;

// copy boxes with their own copies of the tiles, so changing one copy never changes the other
function cloneSlots(slots, uid, tiles = tileList()){
  const ids = {}; let k = 0;
  const tid = old => {
    if (!old) return old;
    if (!ids[old]){
      const t = tiles.find(x => x.id === old); if (!t) return null;
      ids[old] = uid + "_" + (k++);
      tileList().push(JSON.parse(JSON.stringify({...t, id:ids[old]})));
    }
    return ids[old];
  };
  return (slots || []).map((slot, i) => {
    const copy = {...slot, id:uid + "s" + i, mod:tid(slot.mod)};
    if (slot.more) copy.more = slot.more.map(tid).filter(Boolean);
    return copy;
  });
}
// keep Main's current boxes as a saved layout (moved, not copied: Main gets new boxes right after)
function keepMain(why){
  const main = gpAll().find(p => p.id === "main");
  if (!main.slots.length) return;
  gpAll().push({id:newUid(), name:uniqueName(why ? "Main before " + why : mainDated()), cols:GC, slots:main.slots, on:false, saved:true, look:lookSnap(), at:Date.now()});
}
function installStarter(key, onMain, withLook = onMain){
  const c = choiceOf(key); if (!c) return;
  const pages = gpAll(), main = pages.find(p => p.id === "main"), uid = newUid();
  const page = {id:uid, name:c.grid ? "Page " + (cpList().length + 2) : c.pageName || c.name, cols:GC, slots:[], on:true, back:c.back || 0};
  const applyLook = () => { if (!withLook || !c.look) return; Object.assign(LS(), c.saved ? {} : {mode:"Dark", tiles:"Solid", fx:"On", opacity:60}, c.look); };
  if (c.saved) page.slots = cloneSlots(c.page.slots, uid);
  else if (key === "everyday"){
    if (onMain && sameEverydayLayout()){ applyLook(); return; }
    page.slots = cloneSlots(everyday.page.slots, uid, everyday.tiles);
  } else if (c.grid){
    page.slots = c.grid.map(([x,y,w,h], i) => ({id:uid + "s" + i,x,y,w,h,mod:null}));
  } else page.slots = c.boxes.map(({type,x,y,w,h,settings,rotate,name}, i) => {
    const id = uid + "s" + i;
    const ids = [type, ...rotate].map((type,j) => {
      const tid = id + "t" + j;
      const values = j ? {} : {...settings};
      if (type === "list" && firstList()) values.list = firstList().id;
      if (type === "photos" && (SRC.albums || [])[0]) values.album = SRC.albums[0].id;
      const tile = {id:tid,type,settings:values};
      if (name && !j) tile.name = name;
      tileList().push(tile);
      return tid;
    });
    const slot = {id,x,y,w,h,mod:ids[0]};
    if (rotate.length){ slot.more = ids.slice(1); slot.every = 45; }
    return slot;
  });
  if (!onMain){ applyLook(); pages.push(page); return page.id; }
  keepMain(c.saved ? "" : c.name);         // before applyLook, so the saved layout keeps the look it had
  main.slots = page.slots;
  applyLook();
}

function field(mid, key, s, val){
  const a = 'data-m="' + mid + '" data-k="' + key + '" data-t="' + s.type + '"';
  if (s.type === "bool") return row({t:s.label, post: sw(val, a)});
  if (s.type === "color") return row({t:s.label, post:'<input type="color" ' + a + ' value="' + esc(val || "#000000") + '">'});
  if (s.type === "choice") return row({t:s.label, post:'<select ' + a + '>' + s.choices.map(c => '<option' + (c === val ? " selected" : "") + '>' + esc(c) + '</option>').join("") + '</select>'});
  if (s.type === "int" || s.type === "number")
    return row({t:s.label, sub:(s.min != null && s.max != null ? s.min + "–" + s.max : ""), post:'<input type="number" ' + a + (s.min != null ? ' min="' + s.min + '"' : "") +
      (s.max != null ? ' max="' + s.max + '"' : "") + ' step="' + (s.type === "int" ? 1 : "any") + '" value="' + esc(val) + '" inputmode="decimal">'});
  if (s.type === "list") return '<div class="row col"><div class="t"><b>' + esc(s.label) + '</b><small>One per line</small></div><textarea ' + a + '>' + esc((val || []).join("\n")) + '</textarea></div>';
  return '<div class="row col"><div class="t"><b>' + esc(s.label) + '</b></div><input type="text" ' + a + ' value="' + esc(val) + '" autocapitalize="off" spellcheck="false"></div>';
}

async function srcAction(act, k, id){

// drag ⋮⋮ to change the order of pages
let dragged = 0;
document.addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-grip]"); if (!g) return;
  e.preventDefault();
  const r0 = g.closest(".row"), rows = [...r0.parentElement.querySelectorAll("[data-pid]")], from = rows.indexOf(r0), y0 = e.clientY, hgt = r0.offsetHeight;
  let to = from;
  r0.classList.add("drag"); g.setPointerCapture(e.pointerId);
  const move = ev => {
    const dy = Math.max(-from * hgt, Math.min((rows.length - 1 - from) * hgt, ev.clientY - y0));
    to = from + Math.round(dy / hgt);
    r0.style.transform = "translateY(" + dy + "px)";
    rows.forEach((r, i) => { if (r !== r0) r.style.transform = i > from && i <= to ? "translateY(-" + hgt + "px)" : i < from && i >= to ? "translateY(" + hgt + "px)" : ""; });
  };
  const up = () => {
    g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); g.removeEventListener("pointercancel", up);
    dragged = performance.now();
    if (to !== from){
      const L = gpAll(), ids = rows.map(r => r.dataset.pid), [m] = ids.splice(from, 1); ids.splice(to, 0, m);
      const inList = new Set(cpList()), order = ids.map(id => L.find(p => p.id === id)); let k = 0;
      mods.pages.settings.items = L.map(p => inList.has(p) ? order[k++] : p);

    show();
  };
  g.addEventListener("pointermove", move); g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up);
});

/* ---------- effects library: every effect is one small animation that can be turned on, sized and timed on its own ----------
   Shared by the dashboard (full-screen canvases) and Controls (little live previews on each card). */
const FXLIB = (function(){
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const weighted = list => { const tot = list.reduce((a, x) => a + x[1], 0); let r = Math.random() * tot; for (const x of list){ r -= x[1]; if (r <= 0) return x; } return list[0]; };
  const COLORS = ["#ff6b6b","#ffd36e","#6bd3ff","#8fffa0","#c58bff","#ff9ad5","#ffffff"];
  const AMT = {Few:.5, Some:1, Lots:1.8};
  // emoji are drawn once into small canvases and reused (much cheaper than fillText every frame)
  const sprites = {};
  function sprite(g, s){
    s = Math.max(12, Math.round(s / 4) * 4);
    const k = g + s;
    if (!sprites[k]){
      const c = document.createElement("canvas"); c.width = c.height = Math.ceil(s * 1.3);
      const x = c.getContext("2d"); x.font = s + "px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(g, c.width / 2, c.height / 2 + s * .06);
      sprites[k] = c;
    }
    return sprites[k];
  }
  function drawSprite(cx, g, s, x, y, rot, a, sy){
    const sp = sprite(g, s);
    cx.save(); cx.globalAlpha = a; cx.translate(x, y); if (rot) cx.rotate(rot); if (sy) cx.scale(1, sy);
    cx.drawImage(sp, -sp.width / 2, -sp.height / 2); cx.restore();
  }

  /* ----- weather ----- */
  function rain(o){
    const n = Math.round((o.kind === "drizzle" ? 70 : 140) * o.amt), P = [];
    const drop = init => ({x:R(0, o.W * 1.1), y:init ? R(-o.H, o.H) : R(-80, -10), v:R(16, 26), l:R(14, 26)});
    for (let i = 0; i < n; i++) P.push(drop(true));
    let flash = 0, next = Date.now() + R(3e3, 8e3);
    return cx => {
      cx.strokeStyle = o.front ? "rgba(185,210,255,.34)" : "rgba(160,195,255,.3)"; cx.lineWidth = 1.5;
      cx.beginPath();
      for (const p of P){ cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.l * .25, p.y + p.l); p.y += p.v; p.x -= p.v * .25; if (p.y > o.H) Object.assign(p, drop(false)); }
      cx.stroke();
      if (o.kind === "storm" || o.preview){
        if (Date.now() > next){ flash = .16; next = Date.now() + (o.preview ? R(4e3, 7e3) : R(9e3, 25e3)); }
        if (flash > 0){ cx.fillStyle = "rgba(220,230,255," + flash.toFixed(3) + ")"; cx.fillRect(0, 0, o.W, o.H); flash -= .012; }
      }
      return true;
    };
  }
  function snow(o){
    const P = [], f = init => ({x:R(0, o.W), y:init ? R(-o.H, o.H) : R(-30, -5), v:R(.8, 2.2), r:R(2, 5), ph:R(0, 6.3)});
    for (let i = 0; i < Math.round(110 * o.amt); i++) P.push(f(true));
    return cx => {
      cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath();
      for (const p of P){ p.ph += .02; p.y += p.v; p.x += Math.sin(p.ph) * .6; cx.moveTo(p.x + p.r, p.y); cx.arc(p.x, p.y, p.r, 0, 6.29); if (p.y > o.H + 5) Object.assign(p, f(false)); }
      cx.fill(); return true;
    };
  }
  function clouds(o){
    const P = [], c = () => ({x:R(-300, o.W), y:R(-60, o.H * .6), v:R(.1, .3), r:R(240, 460)});
    for (let i = 0; i < Math.max(2, Math.round(6 * o.amt)); i++) P.push(c());
    return cx => {
      for (const p of P){
        p.x += p.v; if (p.x - p.r > o.W){ p.x = -p.r; p.y = R(-60, o.H * .6); }
        const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, "rgba(190,200,215,.13)"); g.addColorStop(1, "rgba(190,200,215,0)");
        cx.fillStyle = g; cx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);

    };
  }
  function fog(o){
    const P = [];
    for (let i = 0; i < Math.max(2, Math.round(5 * o.amt)); i++) P.push({x:R(-o.W, 0), y:R(0, o.H), v:R(.2, .45), h:R(90, 200)});
    return cx => {
      for (const p of P){
        p.x += p.v; if (p.x > o.W) p.x = -o.W;
        const g = cx.createLinearGradient(0, p.y - p.h, 0, p.y + p.h);
        g.addColorStop(0, "rgba(190,198,208,0)"); g.addColorStop(.5, "rgba(190,198,208,.12)"); g.addColorStop(1, "rgba(190,198,208,0)");
        cx.fillStyle = g; cx.fillRect(p.x, p.y - p.h, o.W, p.h * 2);
      }
      return true;
    };
  }
  function sun(o){
    const P = [];
    for (let i = 0; i < Math.round(26 * o.amt); i++) P.push({x:R(0, o.W), y:R(0, o.H), vx:R(-.15, .15), vy:R(-.25, -.05), r:R(1.5, 3.5), ph:R(0, 6.3)});
    let a = 0;
    return cx => {
      const sx = o.W * .8, sy = -60, H = o.H;
      const g = cx.createRadialGradient(sx, sy, 0, sx, sy, H * .95);
      g.addColorStop(0, "rgba(255,214,140,.32)"); g.addColorStop(.5, "rgba(255,200,120,.09)"); g.addColorStop(1, "rgba(255,200,120,0)");
      cx.fillStyle = g; cx.fillRect(0, 0, o.W, H);
      a += .0012;
      cx.save(); cx.translate(sx, sy); cx.rotate(a);
      for (let i = 0; i < 12; i++){
        cx.rotate(Math.PI / 6);
        const rg = cx.createLinearGradient(0, 0, 0, H * 1.1);
        rg.addColorStop(0, "rgba(255,225,160,.11)"); rg.addColorStop(1, "rgba(255,225,160,0)");
        cx.fillStyle = rg; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-70, H * 1.1); cx.lineTo(70, H * 1.1); cx.closePath(); cx.fill();
      }
      cx.restore();
      for (const p of P){
        p.ph += .02; p.x += p.vx; p.y += p.vy; if (p.y < -10){ p.y = H + 10; p.x = R(0, o.W); }
        cx.fillStyle = "rgba(255,236,190," + (.25 + .2 * Math.sin(p.ph)).toFixed(3) + ")";
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill();
      }
      return true;
    };
  }
  function stars(o){
    const P = [];
    for (let i = 0; i < Math.round(70 * o.amt); i++) P.push({x:R(0, o.W), y:R(0, o.H * .7), r:R(.7, 1.9), ph:R(0, 6.3), sp:R(.01, .03)});
    return cx => {
      for (const p of P){ p.ph += p.sp; cx.fillStyle = "rgba(225,232,255," + (.3 + .3 * Math.sin(p.ph)).toFixed(3) + ")"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill(); }
      return true;
    };
  }

  /* ----- seasonal: emoji drifting across the screen. [glyph, weight, motion]: fall | rise | fly | flutter ----- */
  const SETS = {
    leaves:    {n:16, dots:0,  g:[["🍂",5,"fall"],["🍁",5,"fall"],["🌰",1,"fall"],["🍎",1,"fall"]]},
    halloween: {n:16, dots:0,  g:[["🍂",3,"fall"],["🍁",3,"fall"],["🎃",3,"fall"],["🦇",2,"fly"],["👻",1,"rise"],["🍬",1,"fall"]]},
    thanks:    {n:18, dots:0,  g:[["🍂",5,"fall"],["🍁",5,"fall"],["🦃",1,"fall"],["🥧",1,"fall"],["🌽",1,"fall"],["🎃",1,"fall"]]},
    xmas:      {n:12, dots:45, g:[["❄️",4,"fall"],["⭐",1,"fall"],["🎁",1,"fall"],["🔔",1,"fall"],["🍬",1,"fall"],["🎄",1,"fall"]]},
    winter:    {n:8,  dots:55, g:[["❄️",1,"fall"]]},
    newyear:   {n:10, dots:0,  g:[["🎉",1,"fall"],["✨",2,"fall"],["🥳",1,"fall"]]},
    valentine: {n:14, dots:0,  g:[["💕",2,"rise"],["💗",2,"rise"],["❤️",1,"rise"]]},
    spring:    {n:12, dots:0,  g:[["🌸",4,"fall"],["🌼",2,"fall"],["🦋",1,"flutter"]]},
    july4:     {n:10, dots:0,  g:[["⭐",2,"fall"],["🇺🇸",1,"fall"]]},
    summer:    {n:5,  dots:0,  g:[["🦋",2,"flutter"],["🐝",1,"flutter"]]}
  };
  function falling(set){
    return o => {
      const S = SETS[set], W = o.W, H = o.H, P = [], D = [];
      const part = init => {
        const [g, , mo] = weighted(S.g), s = R(24, 58), depth = (s - 24) / 34;
        const p = {g, mo, s, a:.55 + depth * .4, ph:R(0, 6.3), rot:R(-.6, .6), vr:R(-.02, .02)};
        if (mo === "fall"){ p.x = R(0, W); p.y = init ? R(-H, H) : R(-80, -30); p.vy = R(.7, 1.3) + depth * 1.3; }
        if (mo === "rise"){ p.x = R(0, W); p.y = init ? R(0, H * 2) : H + 50; p.vy = -(R(.6, 1.1) + depth); }
        if (mo === "fly"){ p.x = init ? R(-W, W) : -80; p.y = R(H * .05, H * .6); p.vx = R(1.6, 3) + depth; p.rot = 0; p.vr = 0; }
        if (mo === "flutter"){ p.x = R(0, W); p.y = R(H * .1, H * .9); p.vx = R(-1, 1); p.vy = R(-.6, .6); p.rot = 0; p.vr = 0; }
        return p;
      };
      for (let i = 0; i < Math.max(1, Math.round(S.n * o.amt)); i++) P.push(part(true));
      for (let i = 0; i < Math.round(S.dots * o.amt); i++) D.push({x:R(0, W), y:R(-H, H), r:R(1.2, 3.6), v:R(.5, 1.6), ph:R(0, 6.3)});
      return cx => {
        if (D.length){
          cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath();
          for (const d of D){ d.ph += .02; d.y += d.v; d.x += Math.sin(d.ph) * .5; if (d.y > H + 5){ d.y = -5; d.x = R(0, W); } cx.moveTo(d.x + d.r, d.y); cx.arc(d.x, d.y, d.r, 0, 6.29); }
          cx.fill();
        }
        for (const p of P){
          p.ph += .02;
          if (p.mo === "fall"){ p.y += p.vy; p.x += Math.sin(p.ph) * (1 + p.s / 40); p.rot += p.vr + Math.sin(p.ph) * .01; }
          if (p.mo === "rise"){ p.y += p.vy; p.x += Math.sin(p.ph) * .8; }
          if (p.mo === "fly"){ p.x += p.vx; p.y += Math.sin(p.ph * 2) * 1.2; }
          if (p.mo === "flutter"){
            p.vx = Math.max(-1.6, Math.min(1.6, p.vx + R(-.15, .15))); p.vy = Math.max(-1, Math.min(1, p.vy + R(-.12, .12)));
            p.x += p.vx; p.y += p.vy; if (p.x < -40) p.x = W + 30; if (p.x > W + 40) p.x = -30; if (p.y < 0 || p.y > H) p.vy = -p.vy;
          }
          const flap = (p.mo === "fly" || p.mo === "flutter") ? .65 + .35 * Math.abs(Math.sin(p.ph * 5)) : 0;
          drawSprite(cx, p.g, p.s, p.x, p.y, p.rot, p.a, flap);
          if (p.y > H + 70 || p.y < -90 || p.x > W + 90) Object.assign(p, part(false));
        }
        return true;
      };
    };
  }

  /* ----- shows: a short scene that plays once, then ends ----- */
  function show(kind){
    return o => {
      const W = o.W, H = o.H, a = o.amt; let fx = [];
      const N = n => Math.max(1, Math.round(n * a));
      const gust = glyphs => { for (let i = 0; i < N(40); i++) fx.push({k:"spr", g:pick(glyphs), s:R(26, 60), x:R(-600, -40), y:R(H * .1, H * .9), vx:R(9, 16), vy:0, ph:R(0, 6.3), amp:R(1.5, 4), rot:R(0, 6.3), vr:R(.05, .15), a:.9}); };
      if (kind === "gust") gust(["🍂","🍁","🍂","🍁","🌰"]);
      if (kind === "flurry") for (let i = 0; i < N(90); i++) fx.push({k:"dot", x:R(-700, -10), y:R(0, H), vx:R(8, 15), vy:R(.5, 2), r:R(1.5, 4.5), ph:R(0, 6.3)});
      if (kind === "turkey") fx.push({k:"walker", g:"🦃", s:110, x:W + 80, y:H - 70, vx:-2.6, ph:0, trail:"🍂"});
      if (kind === "santa") fx.push({k:"sleigh", x:W + 150, t:0});
      if (kind === "bats") for (let i = 0; i < N(14); i++) fx.push({k:"spr", g:"🦇", s:R(30, 64), x:R(-500, -40), y:R(H * .05, H * .55), vx:R(5, 9), vy:0, ph:R(0, 6.3), amp:R(2, 5), rot:0, vr:0, a:.95, flap:true});
      if (kind === "heartburst") for (let i = 0; i < N(30); i++) fx.push({k:"spr", g:pick(["💕","💗","❤️","💖"]), s:R(26, 56), x:R(0, W), y:H + R(20, 400), vx:0, vy:-R(3, 6), ph:R(0, 6.3), amp:R(1, 3), rot:0, vr:0, a:.9});
      if (kind === "butterflies") for (let i = 0; i < N(6); i++) fx.push({k:"spr", g:pick(["🦋","🦋","🐝"]), s:R(34, 56), x:R(-400, -40), y:R(H * .2, H * .8), vx:R(2.5, 4.5), vy:0, ph:R(0, 6.3), amp:R(2, 4), rot:0, vr:0, a:.95, flap:true});
      if (kind === "fireworks") for (let i = 0; i < N(7); i++) fx.push({k:"rocket", x:R(W * .1, W * .9), y:H + 10, vy:-R(19, 25) * Math.sqrt(H / 1080), fuse:R(.3, .6) * H, delay:i * R(500, 1100), born:Date.now(), c:pick(COLORS)});
      if (kind === "confetti") fx.push({k:"confgen", until:Date.now() + (o.ms || 4500)});
      function step(cx, f, now){
        if (f.k === "spr"){
          f.ph += .06; f.x += f.vx; f.y += f.vy + Math.sin(f.ph) * f.amp; f.rot += f.vr;
          if (f.fade) f.a = Math.max(0, f.a - .01);
          drawSprite(cx, f.g, f.s, f.x, f.y, f.rot, f.a, f.flap ? .6 + .4 * Math.abs(Math.sin(f.ph * 3)) : 0);
          return f.x < W + 120 && f.y > -120 && f.a > 0;
        }
        if (f.k === "dot"){
          f.ph += .05; f.x += f.vx; f.y += f.vy + Math.sin(f.ph) * 2;
          cx.fillStyle = "rgba(255,255,255,.8)"; cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.29); cx.fill();
          return f.x < W + 20;
        }
        if (f.k === "walker"){
          f.ph += .25; f.x += f.vx;
          drawSprite(cx, f.g, f.s, f.x, f.y - Math.abs(Math.sin(f.ph)) * 10, Math.sin(f.ph) * .08, 1, 0);
          if (Math.random() < .08) fx.push({k:"spr", g:f.trail, s:R(20, 30), x:f.x + 40, y:f.y + 20, vx:R(.5, 1.5), vy:-R(.5, 1.5), ph:0, amp:.3, rot:R(0, 6), vr:.05, a:.8, fade:1});
          return f.x > -150;
        }
        if (f.k === "sleigh"){
          f.t += 1; f.x -= 5.2;
          const y = H * .2 + Math.sin(f.x / W * Math.PI) * -H * .08 + Math.sin(f.t * .08) * 6;
          for (let i = 0; i < 3; i++) drawSprite(cx, "🦌", 58, f.x + i * 66, y + Math.sin(f.t * .25 + i) * 5, 0, 1, 0);
          drawSprite(cx, "🛷", 74, f.x + 230, y + 12, 0, 1, 0);
          drawSprite(cx, "🎅", 56, f.x + 226, y - 18, 0, 1, 0);
          if (f.t % 2 === 0) fx.push({k:"spark", x:f.x + 270 + R(-10, 10), y:y + R(-20, 25), life:1, c:pick(["#fff6c2","#ffe27a","#ffffff","#bfe3ff"])});
          return f.x > -420;
        }
        if (f.k === "spark"){
          f.life -= .025; f.y += .4;
          cx.fillStyle = f.c; cx.globalAlpha = Math.max(0, f.life); cx.beginPath(); cx.arc(f.x, f.y, 2.6 * f.life + .5, 0, 6.29); cx.fill(); cx.globalAlpha = 1;
          return f.life > 0;
        }
        if (f.k === "rocket"){
          if (now - f.born < f.delay) return true;
          f.y += f.vy; f.vy *= .975;
          cx.strokeStyle = "rgba(255,240,190,.8)"; cx.lineWidth = 3;
          cx.beginPath(); cx.moveTo(f.x, f.y); cx.lineTo(f.x, f.y - f.vy * 3); cx.stroke();
          if (H - f.y > f.fuse + H * .25 || f.vy > -3){
            for (let i = 0; i < 80; i++){ const an = R(0, 6.29), sp = R(2, 8); fx.push({k:"spk", x:f.x, y:f.y, vx:Math.cos(an) * sp, vy:Math.sin(an) * sp, life:1, c:f.c}); }
            return false;
          }
          return true;
        }
        if (f.k === "spk"){
          f.x += f.vx; f.y += f.vy; f.vy += .07; f.vx *= .985; f.life -= .016;
          cx.globalAlpha = Math.max(0, f.life); cx.fillStyle = f.c; cx.beginPath(); cx.arc(f.x, f.y, 2.8, 0, 6.29); cx.fill(); cx.globalAlpha = 1;
          return f.life > 0;
        }
        if (f.k === "confgen"){
          for (let i = 0; i < Math.max(1, Math.round(3 * a)); i++) fx.push({k:"conf", x:R(0, W), y:-10, vx:R(-2, 2), vy:R(2, 6), r:R(0, 6.3), vr:R(-.2, .2), c:pick(COLORS), w:R(8, 14)});
          return now < f.until;
        }
        if (f.k === "conf"){
          f.x += f.vx; f.y += f.vy; f.vy += .05; f.r += f.vr;
          cx.save(); cx.translate(f.x, f.y); cx.rotate(f.r); cx.fillStyle = f.c; cx.fillRect(-f.w / 2, -3, f.w, 6); cx.restore();
          return f.y < H + 20;
        }
        return false;
      }
      return cx => {
        const now = Date.now(), cur = fx; fx = [];          // a step may add sparks, trails or confetti
        const kept = cur.filter(f => step(cx, f, now));
        fx = kept.concat(fx);
        return fx.length > 0;
      };
    };
  }

  /* ----- when does an effect play ----- */
  function nthWeekday(y, m, wd, n){ const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + 7 * (n - 1)); return d; }
  const mdNum = s => { const [m, d] = String(s).split("-").map(Number); return m * 100 + d; };
  const inMd = (d, a, b) => { const k = (d.getMonth() + 1) * 100 + d.getDate(), x = mdNum(a), y = mdNum(b); return x <= y ? k >= x && k <= y : k >= x || k <= y; };
  function seasonRanges(def, y){
    if (def.season === "thanks"){ const t = nthWeekday(y, 10, 4, 4), s = new Date(t); s.setDate(t.getDate() - 7);
      const f = d => (d.getMonth() + 1) + "-" + d.getDate(); return [[f(s), f(t)]]; }
    return def.season || [];
  }
  function inSeason(def, d){ return seasonRanges(def, d.getFullYear()).some(r => inMd(d, r[0], r[1])); }
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mdTxt = s => { const [m, d] = String(s).split("-").map(Number); return MON[m - 1] + " " + d; };
  function seasonText(def){
    if (def.season === "thanks") return "Thanksgiving week";
    return (def.season || []).map(r => r[0] === r[1] ? mdTxt(r[0]) : mdTxt(r[0]) + "–" + mdTxt(r[1])).join(" and ");
  }
  const WXTXT = {rain:"When it's raining", snow:"When it's snowing", fog:"When it's foggy", clouds:"When it's cloudy", sun:"On clear days", stars:"On clear nights"};
  // one effect's settings: what's saved, filled in with its defaults
  function conf(saved, id){
    const def = BY[id], o = (saved || []).find(x => x && x.id === id) || {};
    return Object.assign({id, on:true, amount:"Some", when: def.wx ? "weather" : def.party ? "birthday" : "season", every: def.layer === "show" ? 15 : 0, from:"", to:""}, o);
  }
  function whenText(c){
    const def = BY[c.id];
    if (c.when === "always") return def.layer === "show" ? "All year" : "Always";
    if (c.when === "dates") return c.from && c.to ? mdTxt(c.from) + "–" + mdTxt(c.to) : "Pick dates";
    if (def.wx) return WXTXT[c.id] || "Matching weather";
    if (def.party) return "On birthdays";
    return seasonText(def);
  }
  function timeOk(c, d){
    if (c.when === "always") return true;
    if (c.when === "dates") return !!(c.from && c.to) && inMd(d, c.from, c.to);
    if (BY[c.id].season) return inSeason(BY[c.id], d);
    return false;
  }
  function wxMode(code, day){
    if (code == null) return null;
    if (code >= 95) return "storm";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 51 && code <= 67) return code <= 57 ? "drizzle" : "rain";
    if (code >= 80 && code <= 82) return "rain";
    if (code === 45 || code === 48) return "fog";
    if (code === 2 || code === 3) return "clouds";
    return day ? "sun" : "stars";
  }

  /* ----- a canvas that runs effects. Drawing is in 1920-wide units (opt.base) and scaled to the canvas ----- */
  function Runner(cv, opt){
    opt = opt || {};
    const cx = cv.getContext("2d");
    let W = 1920, H = 1080, k = 1, list = [], running = false, last = 0, paused = false;
    function size(){
      const w = opt.full ? innerWidth : cv.clientWidth || 320, h = opt.full ? innerHeight : cv.clientHeight || 180;
      const dpr = opt.full ? 1 : Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      W = opt.base || 1920; k = cv.width / W; H = cv.height / k;

    }
    size(); if (opt.full) addEventListener("resize", size);
    function frame(ts){
      if (!running) return;

      last = ts;
      cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
      cx.setTransform(k, 0, 0, k, 0, 0);
      if (opt.under) opt.under(cx, W, H);
      const beh = opt.over ? list.filter(e => e.behind) : [], top = opt.over ? list.filter(e => !e.behind) : list;
      const run = e => { let alive = true; try{ alive = e.draw(cx); }catch(err){ alive = false; } if (!alive && !e.keep){ e.dead = true; if (e.done) e.done(); } };
      beh.forEach(run);
      if (opt.over) opt.over(cx, W, H);
      top.forEach(run);
      list = list.filter(e => !e.dead);
      if (!list.length && !opt.always){ running = false; cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); }
    }
    function start(){ if (!running && !paused && (list.length || opt.always)){ running = true; requestAnimationFrame(frame); } }
    function inst(id, p, keep){
      const def = BY[id]; if (!def) return null;
      const e = {id, key:id + "|" + p.amount + "|" + (p.kind || "") + "|" + !!p.front, keep, behind:!!p.behind,
        make:() => def.make({amt:AMT[p.amount] || 1, kind:p.kind, front:p.front, preview:opt.preview, ms:p.ms, W, H})};
      e.draw = e.make(); return e;
    }
    return {
      // the continuous effects that should be running now: [{id, amount, kind, front, behind}]
      set(want){
        const keys = want.map(p => p.id + "|" + p.amount + "|" + (p.kind || "") + "|" + !!p.front);
        list = list.filter(e => !e.keep || keys.includes(e.key));
        want.forEach((p, i) => { if (!list.some(e => e.keep && e.key === keys[i])){ const e = inst(p.id, p, true); if (e) list.push(e); } });
        start();
      },
      play(id, p, done){ const e = inst(id, p || {}, false); if (!e) return; e.done = done; list.push(e); start(); },
      busy(){ return list.some(e => !e.keep); },
      pause(p){ paused = p; if (p){ running = false; list = list.filter(e => e.keep); cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); } else start(); },
      clear(){ list = []; },
      size, start
    };
  }
  return {L, BY, GROUPS, AMT, conf, whenText, timeOk, inSeason, seasonText, wxMode, Runner, mdTxt};
})();

/* ---------- Look: looks (picture cards + a short Adjust screen), the schedule, effects, the night page ---------- */

/* ----- schedule rules ----- */
function ruleMatches(r, d){
  const w = r.when || {}; if (r.on === false) return false;
  const m = x => { const [h, mi] = String(x).split(":").map(Number); return h * 60 + (mi || 0); }, hm = d.getHours() * 60 + d.getMinutes();
  if (w.from && w.to && w.from !== w.to){ const a = m(w.from), b = m(w.to); if (a < b ? !(hm >= a && hm < b) : !(hm >= a || hm < b)) return false; }
  if (w.days && w.days.length && !w.days.includes(d.getDay())) return false;
  if (w.dFrom && w.dTo){ const n = x => { const [mo, da] = String(x).split("-").map(Number); return mo * 100 + da; }, k = (d.getMonth() + 1) * 100 + d.getDate(), a = n(w.dFrom), b = n(w.dTo);
    if (a <= b ? !(k >= a && k <= b) : !(k >= a || k <= b)) return false; }
  return true;
}
function curLook(){ const R = rules(); for (let i = R.length - 1; i >= 0; i--) if (lookById(R[i].look) && ruleMatches(R[i], new Date())) return R[i].look; return "default"; }

  if (w.days && w.days.length && w.days.length < 7) p.push(w.days.length === 2 && w.days.includes(0) && w.days.includes(6) ? "Weekends" : w.days.length === 5 && !w.days.includes(0) && !w.days.includes(6) ? "Weekdays" : w.days.map(i => DAYS[i]).join(", "));

}

let FXPV = [], fxObs = null;
function pvBg(id){

function pvTiles(cx, W, H){

  const u = W / 1920;

function fxPreviews(){
  FXPV.forEach(p => p.r && p.r.pause(true)); FXPV = [];

  const cvs = [...document.querySelectorAll("canvas[data-fx]")]; if (!cvs.length || typeof FXLIB === "undefined") return;
  const front = mods.effects.settings.front !== false;
  const start = cv => {
    const id = cv.dataset.fx, d = FXLIB.BY[id], f = fxC(id), p = FXPV.find(x => x.cv === cv); if (!p || p.r) { if (p && p.r) p.r.pause(false); return; }
    p.r = FXLIB.Runner(cv, {preview:true, always:true, fps:20, base:1000, under:pvBg(id), over:pvTiles});
    const behind = d.layer === "sky" || (d.layer === "fall" && !front);
    if (d.layer === "show"){ const loop = () => { if (p.r && !p.gone) p.r.play(id, {amount:f.amount, ms:3500}, () => setTimeout(loop, 1500)); }; loop(); }
    else p.r.set([{id, amount:f.amount, kind: id === "rain" ? "storm" : "", front:!behind, behind}]);

  pvFit();
}
function pvCur(){ try{ return pvWin().dashPage(); }catch(e){ return 0; } }
function pvLoad(){ PV.page = pvCur(); $("pvf").src = "/dash/content?preview=1" + (PV.theme ? "&theme=" + PV.theme : "") + (PV.night ? "&night=1" : "") + "&t=" + Date.now(); }
function pvTabs(){
  let L = ["main"];
  try{ L = pvWin().pageList(); }catch(e){}
  const cur = pvCur();
  $("pvpage").innerHTML = L.length < 2 ? "" : L.map((n, i) => '<button data-pg="' + i + '"' + (i === cur ? ' class="on"' : "") + '>' + esc(n === "main" ? "Main" : n === "night" ? "Night" : (cpById(n.slice(2)) || {}).name || n) + '</button>').join("");
}
// called by the dashboard inside the preview
// the editor in the preview: a tile needs a calendar, team... that isn't set up yet
window.dashSetup = kind => { stack = ["root", "src:" + kind]; show(); scrollTo(0, 0); };
window.dashSaved = () => { toast("Layout saved", "ok"); load(); };
if (!ECHO){
  let pvRes = null;
  const pvHold = () => {
    try{ const w = pvWin(); if (w.dashPause && !w.PAUSED) w.dashPause(true); }catch(e){}
    clearTimeout(pvRes); pvRes = setTimeout(() => { try{ pvWin().dashPause(false); }catch(e){} }, 400);
  };
  addEventListener("scroll", pvHold, {passive:true}); addEventListener("wheel", pvHold, {passive:true});
  $("pvedit").addEventListener("click", () => { try{ pvWin().dashEditing() ? pvWin().dashEdit(false) : pvWin().dashEdit(true); }catch(e){} });
  setInterval(() => { let on = false; try{ on = pvWin().dashEditing(); }catch(e){} $("pvedit").classList.toggle("on", on); $("pvedit").textContent = on ? "Cancel editing" : "Edit on screen"; }, 500);
  document.body.classList.add("desk");
  $("pv").hidden = false;
  $("pvf").addEventListener("load", () => setTimeout(() => {
    try{ if (PV.editPage){ const id = PV.editPage; PV.editPage = ""; act("edit", id); } else if (PV.page) pvWin().showPage(PV.page); }catch(e){}
    pvTabs();
  }, 1200));
  $("pvpage").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    try{ pvWin().showPage(+b.dataset.pg); }catch(err){}
    pvTabs();
  });
  setInterval(() => { const b = $("pvpage").querySelector("button.on"); if (b && +b.dataset.pg !== pvCur()) pvTabs(); }, 700);   // follow swipes
  $("pvsize").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    pvSize(b);
  });
  addEventListener("resize", pvFit);
  if (typeof ResizeObserver === "function") new ResizeObserver(pvFit).observe($("pvsize").closest(".pvbar"));
  pvFit(); pvLoad();
}
load();
</script>
</body>
</html>
