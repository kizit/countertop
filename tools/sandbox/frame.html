<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Community tile</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--fg, #fff);
    font: 22px/1.3 var(--font, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif); -webkit-text-size-adjust: none; }
  #tile { box-sizing: border-box; height: 100%; overflow: hidden; }
  #tile h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim, rgba(255,255,255,.6)); }
  #tile .empty { color: var(--dim, rgba(255,255,255,.6)); font-size: 22px; }
  #tile .li { display: flex; gap: 14px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  #tile .li:last-child { border-bottom: 0; }
  #tile .li .t { color: var(--dim, rgba(255,255,255,.6)); white-space: nowrap; }
  #tile .li .s { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #tile button { font: inherit; color: inherit; background: rgba(255,255,255,.12); border: 0; border-radius: 10px; padding: 6px 12px; }
</style>
<div id="tile"></div>

__RUNTIME__
</script>

</html>
